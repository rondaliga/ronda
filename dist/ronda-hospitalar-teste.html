<script>
/* ==========================================================================
   Painel de controle: indicadores, gráficos e listas de atenção.
   ========================================================================== */
(()=>{
const RH=window.RH;
const {$,esc,S,F,pc,dur,ago,fd,fdt,fdm,sod,ic,empty,sevPill,stPill,SEV,ST}=RH;
let cache=null;

/* cartões do painel que a pessoa minimizou (lembrado neste navegador) */
const MINKEY='rh.painel.min';
const minSet=()=>{if(RH.st.minCards)return RH.st.minCards;let a=[];try{a=JSON.parse(localStorage.getItem(MINKEY)||'[]')}catch(e){}return RH.st.minCards=new Set(Array.isArray(a)?a:[])};
const saveMin=()=>{try{localStorage.setItem(MINKEY,JSON.stringify([...minSet()]))}catch(e){}};
/* cartão com botão de minimizar: k = chave, t = título, sub = texto pequeno ao lado do título */
const card=(k,t,sub,body,cls='')=>{const mn=minSet().has(k);
  return `<div class="card ${cls} ${mn?'min':''}" data-card="${k}"><h3><span class="ct">${esc(t)}${sub?` <small>${sub}</small>`:''}</span><button type="button" class="ic-btn min-btn" data-act="togCard" data-k="${k}" aria-expanded="${!mn}" aria-label="${mn?'Expandir':'Minimizar'}: ${esc(t)}" title="${mn?'Expandir':'Minimizar'}">${ic(mn?'dn':'up',14)}</button></h3><div class="card-b" ${mn?'hidden':''}>${body}</div></div>`};

function hbars(rows,o={}){
  rows=rows.filter(r=>r.v>0||o.keepZero);if(!rows.length)return empty('Sem dados no período');
  const m=Math.max(...rows.map(r=>r.v),1);
  return `<div class="hb">${rows.map(r=>`<div class="hb-r" data-tip="${esc(r.l)}: ${r.v}"><span class="hb-l" title="${esc(r.l)}">${esc(r.l)}</span><span class="hb-t"><i style="width:${r.v?Math.max(r.v/m*100,2):0}%;background:${r.c||'var(--c1)'}"></i></span><span class="hb-v">${r.v}</span></div>`).join('')}</div>`}

RH.pages.painel=()=>{
  const now=Date.now(),days=F.periodo,start=sod(now-(days-1)*864e5);
  const setores=[...new Set(S.salas.map(s=>s.setor).filter(Boolean))].sort();
  const okSet=x=>!F.setor||x.setor===F.setor;
  const rs=S.rondas.filter(r=>r.ts>=start&&okSet(r)), ns=S.ncs.filter(n=>n.ts>=start&&okSet(n));
  let C=0,N=0;rs.forEach(r=>{C+=r.c;N+=r.nc});
  const pct=C+N?C/(C+N)*100:null, meta=+S.cfg.meta||95;
  const abertas=S.ncs.filter(n=>n.status!=='resolvida'&&okSet(n)), graves=abertas.filter(n=>n.sev>=3);
  const rz=ns.filter(n=>n.status==='resolvida'&&n.resolvidoEm), tmr=rz.length?rz.reduce((a,n)=>a+(n.resolvidoEm-n.ts),0)/rz.length/36e5:null;
  const nExec=new Set(rs.map(r=>r.execId||r.id)).size;

  /* salas inspecionadas no período */
  const salas=S.salas.filter(s=>s.ativo!==false&&(!F.setor||s.setor===F.setor));
  const insp=new Set(rs.map(r=>r.salaId)), cob=salas.length?salas.filter(s=>insp.has(s.id)).length/salas.length*100:null;

  /* rondas (cadastro "Nome da ronda") em atraso: última execução mais antiga que a periodicidade */
  const lastM={};S.rondas.forEach(r=>{if(r.modeloId&&(!lastM[r.modeloId]||r.ts>lastM[r.modeloId]))lastM[r.modeloId]=r.ts});
  const modelos=S.modelos.filter(m=>m.ativo!==false&&(!F.setor||RH.salasDaRonda(m).some(s=>s.setor===F.setor)||RH.equipsDaRonda(m).some(e=>RH.setorEq(e)===F.setor)));
  const atraso=modelos.filter(m=>RH.agenda.atrasada(m,lastM[m.id]??null,now));

  /* série diária */
  const ser=[];for(let i=0;i<days;i++){ser.push({t:start+i*864e5,c:0,n:0,r:0})}
  rs.forEach(r=>{const i=Math.min(days-1,Math.floor((sod(r.ts)-start)/864e5));if(ser[i]){ser[i].c+=r.c;ser[i].n+=r.nc;ser[i].r++}});
  cache={ser,meta};
  const cnt=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v)};
  const porSetor=cnt(ns,n=>n.setor), porEq=cnt(ns.filter(n=>n.eqNome),n=>n.eqNome+(n.salaNome?' · '+n.salaNome:'')).slice(0,6), porTipo=cnt(ns,n=>n.tipoNome).slice(0,6);
  const sevRows=[4,3,2,1].map(s=>({l:SEV[s],v:ns.filter(n=>n.sev===s).length,c:`var(--s${s})`}));
  const stC={aberta:0,tratamento:0,resolvida:0};ns.forEach(n=>stC[n.status]=(stC[n.status]||0)+1);const stT=ns.length||1;
  const stCol={aberta:'var(--s3)',tratamento:'var(--s1)',resolvida:'var(--good)'};
  const porSala=salas.map(s=>{let c=0,n=0;rs.filter(r=>r.salaId===s.id).forEach(r=>{c+=r.c;n+=r.nc});return {s,p:c+n?c/(c+n)*100:null}}).sort((a,b)=>(a.p??101)-(b.p??101));
  const rec=S.ncs.filter(okSet).slice(0,6);
  const tile=(l,v,sub,cls='')=>`<div class="kpi"><label>${l}</label><strong class="${cls}">${v}</strong><small>${sub}</small></div>`;

  return `<div class="top"><div><h1>Painel de controle</h1><p>Indicadores de conformidade das rondas${F.setor?' · '+esc(F.setor):' · todos os setores'}</p></div>
  <div class="filters"><label class="field"><span>Período</span><select data-set="F:periodo" data-num="1">${[7,30,90].map(d=>`<option value="${d}" ${d===days?'selected':''}>Últimos ${d} dias</option>`).join('')}</select></label>
  <label class="field"><span>Setor</span><select data-set="F:setor"><option value="">Todos os setores</option>${setores.map(s=>`<option ${s===F.setor?'selected':''}>${esc(s)}</option>`).join('')}</select></label></div>
  <div class="tools"><button type="button" class="btn sm" data-act="togTodos" data-v="min">Minimizar tudo</button><button type="button" class="btn sm" data-act="togTodos" data-v="exp">Expandir tudo</button></div></div>
  <section class="kpis" aria-label="Indicadores">
  ${tile('Conformidade geral',pc(pct),pct==null?'Sem rondas no período':pct>=meta?`Meta de ${meta}% atingida`:`Abaixo da meta de ${meta}%`,pct==null?'':pct>=meta?'good':'badc')}
  ${tile('Rondas realizadas',nExec.toLocaleString('pt-BR'),`${(C+N).toLocaleString('pt-BR')} itens avaliados`)}
  ${tile('NCs em aberto',abertas.length,`${graves.length} de severidade alta ou crítica`,graves.length?'badc':'')}
  ${tile('Tempo médio de resolução',dur(tmr),`${rz.length} NC${rz.length===1?'':'s'} resolvida${rz.length===1?'':'s'}`)}
  ${tile('Cobertura de salas',pc(cob),`${salas.filter(s=>insp.has(s.id)).length} de ${salas.length} salas inspecionadas`)}
  ${tile('Rondas em atraso',atraso.length,atraso.length?'Veja a lista abaixo':'Todas dentro da agenda',atraso.length?'badc':'good')}
  </section>
  <section class="grid2">
  ${card('linha','Conformidade por dia',`meta ${meta}%`,'<div id="ch-line"></div>','span2')}
  ${card('setor','Não conformidades por setor',`${ns.length} no período`,hbars(porSetor))}
  ${card('sev','Por severidade','',hbars(sevRows,{keepZero:1}))}
  ${card('situacao','Situação das NCs do período','',ns.length?`<div class="seg-bar" role="img" aria-label="Distribuição por situação">${Object.keys(ST).map(k=>stC[k]?`<i style="flex:${stC[k]};background:${stCol[k]}" data-tip="${ST[k]}: ${stC[k]}"></i>`:'').join('')}</div>
   <div class="legend">${Object.keys(ST).map(k=>`<span><i style="background:${stCol[k]}"></i>${ST[k]} <b>${stC[k]||0}</b> <small>(${Math.round((stC[k]||0)/stT*100)}%)</small></span>`).join('')}</div>`:empty('Sem NCs no período'))}
  ${card('tipos','Tipos de NC mais frequentes','',hbars(porTipo))}
  ${card('equip','Equipamentos com mais NCs','',hbars(porEq))}
  ${card('atraso','Rondas em atraso','',atraso.length?`<div class="hb">${atraso.slice(0,6).map(m=>`<div class="hb-r" style="grid-template-columns:1fr auto"><span class="hb-l" style="color:var(--ink)">${esc(m.nome)} <small>${(m.salaIds||[]).length} sala${(m.salaIds||[]).length===1?'':'s'}</small></span><span class="pill late">${lastM[m.id]?ago(lastM[m.id]):'Nunca realizada'}</span></div>`).join('')}</div>`:empty('Nenhuma ronda em atraso','Todas as rondas estão dentro da agenda de dias e horários.'))}
  ${card('sala','Conformidade por sala','ordenado da menor para a maior',porSala.length?`<div class="hb">${porSala.map(x=>`<div class="hb-r" data-tip="${esc(x.s.nome)}: ${pc(x.p)}"><span class="hb-l">${esc(x.s.nome)}</span><span class="hb-t"><i style="width:${x.p??0}%;background:${x.p==null?'transparent':x.p>=meta?'var(--c1)':'var(--s3)'}"></i></span><span class="hb-v">${x.p==null?'—':Math.round(x.p)+'%'}</span></div>`).join('')}</div><p class="hint" style="margin:10px 0 0">Barras vermelhas estão abaixo da meta de ${meta}%.</p>`:empty('Nenhuma sala cadastrada','Cadastre salas em Cadastros.'),'span2')}
  ${card('recentes','Não conformidades recentes','',rec.length?`<div class="tw" style="border:0"><table><thead><tr><th>Data</th><th>Local</th><th>Descrição</th><th>Severidade</th><th>Situação</th></tr></thead><tbody>${rec.map(n=>`<tr data-act="ncOpen" data-id="${n.id}"><td class="num">${fdt(n.ts)}</td><td>${esc(n.eqNome||n.salaNome)}<small>${esc(n.eqNome?n.salaNome:n.setor||'')}</small></td><td>${esc((n.desc||n.itemTexto||'').slice(0,80))}</td><td>${sevPill(n.sev)}</td><td>${stPill(n.status)}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma não conformidade registrada'),'span2')}
  </section>`;
};

/* gráfico de linha da conformidade diária (SVG próprio) */
function drawLine(){
  const el=$('#ch-line');if(!el||!cache)return;
  const {ser,meta}=cache,W=Math.max(300,el.clientWidth||640),H=230,L=40,Rr=14,T=12,B=26;
  const pts=ser.map((d,i)=>({i,t:d.t,v:d.c+d.n?d.c/(d.c+d.n)*100:null,r:d.r,n:d.n}));
  const vals=pts.filter(p=>p.v!=null).map(p=>p.v);
  if(!vals.length){el.innerHTML=empty('Sem rondas no período','Registre uma ronda para ver a evolução da conformidade.');return}
  const lo=Math.max(0,Math.floor((Math.min(...vals,meta)-4)/10)*10),hi=100;
  const x=i=>L+(pts.length<2?0:i/(pts.length-1))*(W-L-Rr), y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';for(let v=lo;v<=hi;v+=(hi-lo>40?20:10))g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" fill="var(--muted)" font-size="11">${v}%</text>`;
  const step=Math.ceil(pts.length/(W<520?5:8));let xt='';pts.forEach((p,i)=>{if(i%step===0||(i===pts.length-1&&i%step>=Math.ceil(step/2)))xt+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" fill="var(--muted)" font-size="11">${fdm(p.t)}</text>`});
  let d='',pen=false;pts.forEach(p=>{if(p.v==null){pen=false;return}d+=(pen?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1);pen=true});
  const dots=pts.filter(p=>p.v!=null).map((p,k,a)=>`<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${k===a.length-1?5:pts.length>45?0:3}" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Conformidade diária, de ${pc(Math.min(...vals))} a ${pc(Math.max(...vals))}">${g}
  <line x1="${L}" x2="${W-Rr}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-Rr}" y="${y(meta)-5}" text-anchor="end" fill="var(--ok)" font-size="11" font-weight="600">Meta ${meta}%</text>
  <path d="${d}" fill="none" stroke="var(--c1)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xt}
  <line id="xh" y1="${T}" y2="${H-B}" stroke="var(--line2)" stroke-dasharray="3 3" visibility="hidden"/><circle id="xd" r="5" fill="var(--c1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/><rect x="${L}" y="${T}" width="${W-L-Rr}" height="${H-T-B}" fill="transparent" id="xr"/></svg>`;
  const svg=el.firstChild,r=$('#xr',svg),xh=$('#xh',svg),xd=$('#xd',svg);
  r.addEventListener('mousemove',e=>{const b=svg.getBoundingClientRect(),sx=(e.clientX-b.left)*W/b.width;
    let best=null;pts.forEach(p=>{if(p.v==null)return;if(!best||Math.abs(x(p.i)-sx)<Math.abs(x(best.i)-sx))best=p});if(!best)return;
    xh.setAttribute('x1',x(best.i));xh.setAttribute('x2',x(best.i));xh.setAttribute('visibility','visible');xd.setAttribute('cx',x(best.i));xd.setAttribute('cy',y(best.v));xd.setAttribute('visibility','visible');
    RH.showTip(`${fd(best.t)} · ${pc(best.v)} · ${best.r} sala${best.r===1?'':'s'} · ${best.n} NC`,e.clientX,e.clientY)});
  r.addEventListener('mouseleave',()=>{RH.tip.hidden=true;xh.setAttribute('visibility','hidden');xd.setAttribute('visibility','hidden')});
}
RH.after.painel=drawLine;
Object.assign(RH.ACT,{togCard:el=>{
  const k=el.dataset.k,box=el.closest('.card'),m=minSet(),fechar=!m.has(k);
  fechar?m.add(k):m.delete(k);saveMin();
  box.classList.toggle('min',fechar);box.querySelector('.card-b').hidden=fechar;
  el.setAttribute('aria-expanded',String(!fechar));el.innerHTML=ic(fechar?'dn':'up',14);
  const t=box.querySelector('.ct').firstChild.textContent.trim();el.setAttribute('aria-label',(fechar?'Expandir':'Minimizar')+': '+t);el.title=fechar?'Expandir':'Minimizar';
  if(!fechar&&k==='linha')drawLine()},
  /* minimiza ou expande todos os cartões de uma vez */
  togTodos:el=>{const fechar=el.dataset.v==='min',m=minSet();
    document.querySelectorAll('.card[data-card]').forEach(c=>{const k=c.dataset.card;fechar?m.add(k):m.delete(k)});saveMin();RH.renderView(true)}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(RH.st.page==='painel')drawLine()},150)});
})();

</script>
<script>
/* ==========================================================================
   Nova ronda: lista as rondas cadastradas (Cadastros → Rondas) que o usuário pode
   realizar e conduz o preenchimento do checklist de TODAS as salas da ronda.

   Regras de acesso:
   - ronda com responsável  → só ele a vê e realiza;
   - ronda com responsável "Todos" → todos os usuários com acesso à tela (todos os inspetores).
   Ao finalizar, gera um documento em `rondas` por sala visitada (todos com o mesmo
   execId, modeloId e modeloNome) e uma não conformidade em `ncs` para cada item NC.
   ========================================================================== */
(()=>{
const RH=window.RH;
const {$,esc,S,st,byId,userName,pc,ago,fdt,fd,ic,empty,toast,SEV}=RH;

/* A ronda é percorrida na ordem definida no cadastro: cada sala ou equipamento é um bloco.
   Alvo = o que recebe um checklist: a própria sala (a:'s') ou um equipamento (a:'e'). */
function blocosDa(m){
  const o=[];
  RH.ordemDaRonda(m).forEach(k=>{
    const id=k.slice(2);
    if(k[0]==='s'){const s=byId(S.salas,id);if(s&&s.ativo!==false)o.push({id:s.id,tipo:'sala',salaId:s.id,setor:s.setor||'Sem setor'})}
    else{const e=byId(S.equipamentos,id);if(e&&e.ativo!==false)o.push({id:'eq:'+e.id,tipo:'eq',salaId:null,setor:RH.setorEq(e)||'Sem setor',eqIds:[e.id]})}});
  return o}
/* itens a verificar: os do próprio cadastro; cadastro antigo sem itens usa o checklist vinculado */
const itensProprios=x=>({itens:(x.itens&&x.itens.length)?x.itens:(byId(S.checklists,x.checklistId)?.itens||[]),nome:''});
function alvos(bl){
  if(bl.tipo==='sala'){const s=byId(S.salas,bl.salaId);return s?[{a:'s',i:s.id,n:s.nome,cl:itensProprios(s)}]:[]}
  return bl.eqIds.map(id=>byId(S.equipamentos,id)).filter(Boolean).map(e=>({a:'e',i:e.id,n:e.nome,eq:e,cl:itensProprios(e)}))}
const tagTipo=a=>a==='e'?'<span class="tag tag-e">Equipamento</span>':'<span class="tag tag-s">Sala</span>';
/* liberação em grupo definida no cadastro da ronda: 's:ID'/'e:ID' → id do bloco */
const blId=k=>k[0]==='s'?k.slice(2):'eq:'+k.slice(2);
const libDe=m=>{const o={};Object.entries(m.liberacao||{}).forEach(([d,k])=>{o[blId(d)]=blId(k)});return o};
const prefix=(sid,al)=>`${sid}:${al.a}:${al.i}:`;
const thumbEq=e=>e.thumb?`<img class="thumb" src="${e.thumb}" alt="${esc(e.nome)}">`:`<div class="thumb">${ic('dev',22)}</div>`;
RH.thumbEq=thumbEq;


/* ---------- lista de rondas ---------- */
const visiveis=()=>S.modelos.filter(m=>RH.access.rondaVisivel(m,st.me)).sort((a,b)=>a.nome.localeCompare(b.nome));
const lastExec=id=>{let l=null;S.rondas.forEach(r=>{if(r.modeloId===id&&(!l||r.ts>l.ts))l=r});return l};

RH.pages.ronda=()=>{
  const lista=visiveis();
  const vazio=!S.modelos.length
    ?empty('Nenhuma ronda cadastrada',st.me.role==='admin'?'Cadastre as rondas em Cadastros → Rondas (nome, salas e responsável).':'Peça ao administrador para cadastrar as rondas.')
    :empty('Nenhuma ronda disponível para você','As rondas são exibidas apenas ao responsável escolhido ou a todos os inspetores quando não há responsável. Fale com o administrador.');
  return `<div class="top"><div><h1>Nova ronda</h1><p>Escolha a ronda que você vai realizar.</p></div></div>
  ${st.R?`<div class="banner">Há uma ronda em andamento (${esc(st.R.nome)}). <button class="btn sm" data-act="resumeRonda">Continuar ronda</button></div>`:''}
  ${lista.length?`<div class="salas">${lista.map(m=>{
    const l=lastExec(m.id),late=RH.agenda.atrasada(m,l?l.ts:null),salas=RH.salasDaRonda(m),setores=[...new Set([...salas.map(s=>s.setor||'Sem setor'),...RH.equipsDaRonda(m).map(e=>RH.setorEq(e)||'Sem setor')])].sort((a,b)=>a.localeCompare(b)),prox=RH.agenda.proximo(m,Date.now());
    const ne=RH.equipsDaRonda(m).length;
    return `<button class="sala" data-act="pickRonda" data-id="${m.id}"><div class="h"><b>${esc(m.nome)}</b>${late?'<span class="pill late">Em atraso</span>':'<span class="pill okp">Em dia</span>'}</div>
    <div class="f"><span>${esc(setores.join(', ')||'—')}</span></div>
    <div class="f"><span>${salas.length} sala${salas.length===1?'':'s'}</span><span>${ne} equipamento${ne===1?'':'s'}</span></div>
    <div class="f"><span>Responsável: ${m.responsavelId?esc(userName(m.responsavelId)):'todos os inspetores'}</span></div>
    <small>${esc(RH.agenda.resumo(m))}${prox?` · próxima: ${RH.agenda.fmtSlot(prox)}`:''}</small>
    <small>${l?`Última realização ${ago(l.ts)}`:'Nunca realizada'}</small></button>`}).join('')}</div>`:vazio}`;
};

/* ---------- vínculo em lote: salas e equipamentos → ronda ----------
   Usado pelas Ações em Lote de Cadastros. Os itens são referenciados como na ordem de percurso:
   's:<id>' (sala) e 'e:<id>' (equipamento). Regra de negócio mantida: um item só pode estar em UMA ronda. */
const itemRef=k=>k[0]==='s'?byId(S.salas,k.slice(2)):k[0]==='e'?byId(S.equipamentos,k.slice(2)):null;
/* ronda (≠ ignorarId) que já contém o item, se houver */
RH.rondaDoItem=(k,ignorarId)=>S.modelos.find(m=>m.id!==ignorarId&&RH.ordemDaRonda(m).includes(k));
/* ordena para o percurso: setor → salas antes de equipamentos → nome */
RH.ordenaItens=keys=>{
  const setor=k=>k[0]==='s'?(itemRef(k)?.setor||''):(RH.setorEq(itemRef(k)||{})||'');
  return [...keys].sort((a,b)=>setor(a).localeCompare(setor(b))||a[0].localeCompare(b[0])*-1||(itemRef(a)?.nome||'').localeCompare(itemRef(b)?.nome||''))};
/* separa o que pode entrar na ronda do que será ignorado (e por quê). modeloId vazio = ronda nova */
RH.rondaPlano=(modeloId,keys)=>{
  const m=modeloId?byId(S.modelos,modeloId):null,atual=new Set(m?RH.ordemDaRonda(m):[]),add=[],skip={ja:[],outra:[],inativo:[]};
  keys.forEach(k=>{const x=itemRef(k);if(!x)return;
    if(atual.has(k))skip.ja.push(k);
    else if(x.ativo===false)skip.inativo.push(k);
    else if(RH.rondaDoItem(k,modeloId))skip.outra.push(k);
    else add.push(k)});
  return{m,add:RH.ordenaItens(add),skip}};
/* acrescenta ao fim da ronda (grava ordem + salaIds + equipIds, como o formulário da ronda). Devolve quantos entraram. */
RH.rondaAdicionar=async(modeloId,keys)=>{
  const{m,add}=RH.rondaPlano(modeloId,keys);if(!m||!add.length)return 0;
  const ordem=[...RH.ordemDaRonda(m),...add];
  await RH.upd('modelos',m.id,{ordem,salaIds:ordem.filter(k=>k[0]==='s').map(k=>k.slice(2)),equipIds:ordem.filter(k=>k[0]==='e').map(k=>k.slice(2))});
  return add.length};

/* ---------- execução ---------- */
function startRonda(id){
  const m=byId(S.modelos,id);if(!m)return;
  if(!RH.access.rondaVisivel(m,st.me)){toast('Você não tem acesso a esta ronda.','bad');return}
  const blocos=blocosDa(m);
  if(!blocos.length){toast('Esta ronda não tem salas nem equipamentos ativos. Ajuste em Cadastros → Rondas.','bad');return}
  st.R={modeloId:m.id,nome:m.nome,resp:m.responsavelId||'',blocos,itens:itensDe(blocos),obs:'',started:Date.now(),chk:{},lib:libDe(m)};
  saveDraft();
  RH.renderView(true);scrollTo(0,0);
}
function itensDe(blocos){
  const itens={};
  blocos.forEach(bl=>alvos(bl).forEach(al=>(al.cl?.itens||[]).forEach(it=>{itens[prefix(bl.id,al)+it.id]={sid:bl.id,a:al.a,i:al.i,n:al.n,t:it.t,r:''}})));
  return itens}

/* ---------- rascunho da ronda em andamento (auto-save) ----------
   A ronda ativa é gravada no localStorage (uma chave por usuário) a cada resposta/edição.
   Ao recarregar, fechar a aba ou voltar à tela, ela é restaurada; é apagada ao finalizar ou descartar. */
const DRAFT_PREFIX='rh_ronda_draft:';
const draftKey=()=>st.me?DRAFT_PREFIX+st.me.id:null;
const CAMPOS=['r','tipoId','sev','desc','just','thumb','full'];
function gravar(k,R,nivel){
  /* nivel 0 = tudo; 1 = sem a foto grande; 2 = sem nenhuma foto (se o armazenamento estiver cheio) */
  const itens={};
  Object.entries(R.itens).forEach(([ik,it])=>{
    if(!(it.r||it.desc||it.just||it.tipoId))return;
    const o={};CAMPOS.forEach(c=>{if(it[c]&&!(c==='full'&&nivel>=1)&&!(c==='thumb'&&nivel>=2))o[c]=it[c]});itens[ik]=o});
  localStorage.setItem(k,JSON.stringify({v:1,uid:st.me.id,modeloId:R.modeloId,nome:R.nome,resp:R.resp,obs:R.obs||'',started:R.started,sub:R.sub||null,foco:R.foco||null,chk:R.chk||{},itens,savedAt:Date.now()}))}
let draftT;
function saveDraft(){
  clearTimeout(draftT);
  const k=draftKey();if(!k||!st.R)return;
  st.draftErr=true;
  for(let n=0;n<3;n++){try{gravar(k,st.R,n);st.draftErr=false;return}catch(e){}}
}
const saveDraftSoon=()=>{clearTimeout(draftT);draftT=setTimeout(saveDraft,300)};
function clearDraft(){clearTimeout(draftT);st.draftErr=false;try{const k=draftKey();if(k)localStorage.removeItem(k)}catch(e){}}
function restoreDraft(){
  const k=draftKey();if(st.R||!k)return;
  let d;try{d=JSON.parse(localStorage.getItem(k)||'null')}catch(e){d=null}
  if(!d||d.uid!==st.me.id)return;
  const m=byId(S.modelos,d.modeloId);
  if(!m||!RH.access.rondaVisivel(m,st.me)){clearDraft();return}   /* ronda removida ou sem acesso: descarta */
  const blocos=blocosDa(m),itens=itensDe(blocos);
  if(!blocos.length){clearDraft();return}
  Object.entries(d.itens||{}).forEach(([ik,v])=>{if(itens[ik])CAMPOS.forEach(c=>{if(v[c]!=null)itens[ik][c]=v[c]})});
  st.R={modeloId:m.id,nome:m.nome,resp:m.responsavelId||'',blocos,itens,obs:d.obs||'',started:d.started||Date.now(),lib:libDe(m)};
  if(d.sub)st.R.sub=d.sub;
  st.R.chk=d.chk||{};   /* check-ins de presença (código + antena) */
  const foco=d.foco&&itens[d.foco]?d.foco:null;
  if(foco){st.R.foco=foco;setTimeout(()=>document.getElementById('it-'+foco)?.scrollIntoView({block:'center'}),150)}
  /* celulares com pouca memória podem recarregar a página enquanto a câmera está aberta */
  toast(foco&&!itens[foco].thumb?'A página foi recarregada ao abrir a câmera. Sua ronda foi recuperada; anexe a foto novamente.':'Ronda em andamento recuperada do rascunho.');
}
RH.rondaDraft={save:saveDraft,clear:clearDraft,restore:restoreDraft};
/* ao tocar em "Anexar foto", guarda qual item era e salva já (a câmera pode descarregar a página) */
document.addEventListener('click',e=>{const f=e.target.closest&&e.target.closest('[data-nc-foto]');if(f&&st.R){st.R.foco=f.dataset.k;saveDraft();try{localStorage.setItem('rh_resume',JSON.stringify({uid:st.me.id,page:'ronda',ts:Date.now()}))}catch(x){}}},true);
addEventListener('pagehide',saveDraft);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveDraft()});

/* item de equipamento cujo texto contém "Temperatura": exige foto do equipamento (exceto se Inacessível) */
const fotoObrig=it=>!!it&&it.a==='e'&&/temperatura/i.test(it.t||'')&&it.r!=='IN';
const fotoBtns=(it,k)=>`<div class="full ph">${it.thumb?`<img src="${it.thumb}" alt="Foto do equipamento"><button type="button" class="btn sm" data-act="rmFoto" data-k="${k}">Remover foto</button>`:''}
  <button type="button" class="btn sm" data-act="camOpen" data-k="${k}">${ic('cam',16)} ${it.thumb?'Tirar outra foto':'Tirar foto'}</button>
  <label class="btn sm" style="cursor:pointer">${ic('up',16)} Da galeria<input class="sr" type="file" accept="image/*" data-nc-foto data-k="${k}"></label></div>`;
function itemHtml(k){
  const it=st.R.itens[k],nc=it.r==='NC',ina=it.r==='IN',tipo=nc?byId(S.tiposNC,it.tipoId):null;
  return `<div class="it" id="it-${k}"><div class="it-row"><div class="it-t">${esc(it.t)}</div>
  <div class="seg" role="group" aria-label="Resultado">${[['C','Conforme','c'],['NC','Não conforme','n'],['IN','Inacessível','a']].map(([v,l,c])=>`<button type="button" class="${c}" data-act="res" data-k="${k}" data-r="${v}" aria-pressed="${it.r===v}">${l}</button>`).join('')}</div></div>
  ${nc?`<div class="ncp"><label class="field"><span>Tipo de não conformidade</span><select data-nc="tipoId" data-k="${k}"><option value="">Selecione…</option>${S.tiposNC.map(t=>`<option value="${t.id}" ${it.tipoId===t.id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></label>
  <label class="field"><span>Severidade</span><select data-nc="sev" data-k="${k}">${[1,2,3,4].map(s=>`<option value="${s}" ${(it.sev||2)==s?'selected':''}>${s} · ${SEV[s]}</option>`).join('')}</select></label>
  ${tipo&&tipo.orient?`<div class="full">${RH.orientBox(tipo.orient)}</div>`:''}
  <label class="field full"><span>Descrição do problema</span><textarea data-nc="desc" data-k="${k}" placeholder="O que foi encontrado, onde e em que condição?">${esc(it.desc||'')}</textarea></label>
  ${fotoObrig(it)?'<div class="full"><b>Foto do equipamento (obrigatória)</b></div>':''}<div class="full ph">${it.thumb?`<img src="${it.thumb}" alt="Foto da não conformidade"><button type="button" class="btn sm" data-act="rmFoto" data-k="${k}">Remover foto</button>`:''}
  <button type="button" class="btn sm" data-act="camOpen" data-k="${k}">${ic('cam',16)} ${it.thumb?'Tirar outra foto':'Tirar foto'}</button>
  <label class="btn sm" style="cursor:pointer">${ic('up',16)} Da galeria<input class="sr" type="file" accept="image/*" data-nc-foto data-k="${k}"></label></div></div>`:''}
  ${it.r==='C'&&fotoObrig(it)?`<div class="ncp"><div class="full"><b>Foto do equipamento (obrigatória)</b><small style="display:block;color:var(--ink2)">Fotografe o equipamento mostrando a temperatura.</small></div>${fotoBtns(it,k)}</div>`:''}
  ${ina?`<div class="ncp ina"><label class="field full"><span>Descrição (obrigatória) · por que o item está inacessível?</span><textarea data-ina="just" data-k="${k}" id="ina-${k}" required aria-required="true" placeholder="Explique o motivo (ex.: sala ocupada, equipamento em uso, acesso restrito)">${esc(it.just||'')}</textarea></label></div>`:''}</div>`;
}

/* ---------- presença no local (código de barras + antena Wi-Fi) ---------- */
const hora=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const REDE={confere:'antena Wi-Fi conferida',indisponivel:'antena Wi-Fi não verificada',sem_cadastro:'local sem antena cadastrada',nao_exigida:''};
function chkHtml(bl,e){
  if(!e.ativo)return '';
  if(e.semCodigo)return '';   /* local sem código cadastrado: nada a mostrar (a ausência aparece no cadastro e no histórico) */
  if(e.ok)return `<div class="chk-box ok"><span class="pill okp"><i></i>Presença confirmada${e.dependente?' em '+esc(e.alvo.nome):''} às ${hora(e.ok.ts)}</span><small>${esc(REDE[e.ok.rede]||'')}</small></div>`;
  const f=e.falhas[e.falhas.length-1];
  const nDep=RH.local.dependentes(st.R,bl.id).length,alvoId=e.viaId||bl.id;
  const msg=e.dependente?`Leia o código de barras de ${esc(e.alvo.nome)} para liberar este local.`:nDep?`Leia o código de barras para liberar este local e mais ${nDep} do grupo.`:'Leia o código de barras do local para liberar o checklist.';
  return `<div class="chk-box pend${e.bloqueado?' blk':''}"><div><b>${e.bloqueado?msg:'Presença no local ainda não confirmada (opcional).'}</b>${f?`<div class="err" role="alert">${esc(f.msg)}</div>`:''}</div>
    <button type="button" class="btn pri sm" data-act="chkScan" data-id="${esc(alvoId)}">${ic('cam',16)} Ler código${e.dependente?' de '+esc(e.alvo.nome):' do local'}</button></div>`}

function blocoHtml(bl){
  const R=st.R,e=RH.local.estado(R,bl);
  const sala=bl.tipo==='sala'?byId(S.salas,bl.salaId):null;
  const h=sala?`<div class="sala-h"><h2>${esc(sala.nome)}</h2><small>${esc(sala.setor||'')}${sala.andar?' · '+esc(sala.andar):''}</small></div>`
    :`<div class="sala-h"><h2>Equipamentos</h2><small>${esc(bl.setor)}</small></div>`;
  return `<section class="bl" id="bl-${esc(bl.id)}">${h}${chkHtml(bl,e)}`+alvos(bl).map(al=>{
    const ks=Object.keys(R.itens).filter(k=>k.startsWith(prefix(bl.id,al)));
    const ico=al.eq?thumbEq(al.eq):`<div class="thumb">${ic('shield',22)}</div>`;
    if(!ks.length)return `<div class="grp noitems"><div class="gh">${ico}<div class="t"><b>${tagTipo(al.a)}${esc(al.n)}</b><small>Sem itens a verificar${st.me.role==='admin'?' · cadastre em Cadastros':''}</small></div></div></div>`;
    return `<div class="grp"><div class="gh">${ico}<div class="t"><b>${tagTipo(al.a)}${esc(al.n)}</b><small>${al.eq?esc(RH.setorEq(al.eq)||''):esc(al.cl?.nome||'')}</small></div></div><div class="items${e.bloqueado?' locked':''}"${e.bloqueado?' inert aria-disabled="true"':''}>${ks.map(itemHtml).join('')}</div></div>`}).join('')+'</section>'}

function repaintBloco(id){
  const bl=st.R&&st.R.blocos.find(b=>b.id===id),el=document.getElementById('bl-'+id);
  if(bl&&el)el.outerHTML=blocoHtml(bl);progress()}

function rondaForm(){
  const R=st.R,blocos=R.blocos;
  const hasItems=Object.keys(R.itens).length>0;
  const nSalas=blocos.filter(b=>b.tipo==='sala').length,nEq=blocos.reduce((n,b)=>n+(b.eqIds?b.eqIds.length:0),0);
  return `<div class="top"><div><h1>${esc(R.nome)}</h1><p>${nSalas} sala${nSalas===1?'':'s'} · ${nEq} equipamento${nEq===1?'':'s'} · Início às ${hora(R.started)} · Responsável: ${R.resp?esc(userName(R.resp)):'todos os inspetores'} · Inspetor: ${esc(st.me.nome)}</p></div>
  <button class="btn" data-act="cancelRonda">${ic('x',16)} Descartar ronda</button></div>
  <div class="rhead"><div class="prog"><b id="prog-t"></b><div class="bar"><i id="prog-b" style="width:0"></i></div></div><button class="btn pri" data-act="submitRonda" id="btn-sub">${ic('check',16)} Finalizar ronda</button></div>
  ${hasItems?blocos.map(blocoHtml).join(''):empty('Esta ronda não tem itens de checklist','Vincule checklists às salas e aos equipamentos em Cadastros.')}
  <div class="card"><label class="field"><span>Observações gerais da ronda (opcional)</span><textarea id="r-obs" data-robs>${esc(R.obs)}</textarea></label></div>`;
}
RH.rondaForm=rondaForm;

function progress(){
  const v=Object.values(st.R.itens),t=v.length,a=v.filter(x=>x.r).length,n=v.filter(x=>x.r==='NC').length;
  const pt=$('#prog-t');if(!pt)return;pt.textContent=`${a} de ${t} itens respondidos${n?` · ${n} não conformidade${n>1?'s':''}`:''}`;$('#prog-b').style.width=(t?a/t*100:0)+'%'}
RH.rondaProgress=progress;
function repaint(k){const e=document.getElementById('it-'+k);if(e)e.outerHTML=itemHtml(k);progress()}

async function submitRonda(){
  const R=st.R,its=Object.entries(R.itens);
  document.querySelectorAll('.it.miss').forEach(e=>e.classList.remove('miss'));
  if(!its.length){toast('Não há itens para registrar nesta ronda.','bad');return}
  const un=its.filter(([,i])=>!i.r);
  if(un.length){un.forEach(([k])=>document.getElementById('it-'+k)?.classList.add('miss'));document.getElementById('it-'+un[0][0])?.scrollIntoView({block:'center'});toast(`Faltam ${un.length} item(ns) sem resposta.`,'bad');return}
  const bad=its.filter(([,i])=>i.r==='NC'&&(!i.tipoId||!(i.desc||'').trim()));
  if(bad.length){bad.forEach(([k])=>document.getElementById('it-'+k)?.classList.add('miss'));document.getElementById('it-'+bad[0][0])?.scrollIntoView({block:'center'});toast('Informe o tipo e a descrição de cada não conformidade.','bad');return}
  const noJust=its.filter(([,i])=>i.r==='IN'&&!(i.just||'').trim());
  if(noJust.length){noJust.forEach(([k])=>document.getElementById('it-'+k)?.classList.add('miss'));document.getElementById('it-'+noJust[0][0])?.scrollIntoView({block:'center'});document.getElementById('ina-'+noJust[0][0])?.focus({preventScroll:true});toast('Descreva o motivo de cada item marcado como Inacessível.','bad');return}
  const semFoto=its.filter(([,i])=>fotoObrig(i)&&!i.thumb);
  if(semFoto.length){semFoto.forEach(([k])=>document.getElementById('it-'+k)?.classList.add('miss'));document.getElementById('it-'+semFoto[0][0])?.scrollIntoView({block:'center'});toast(`Tire a foto do equipamento em ${semFoto.length} item(ns) de Temperatura.`,'bad');return}
  /* presença no local: sem leitura válida do código (e da antena, se cadastrada) o bloco não pode ser finalizado */
  const pend=RH.local.pendencias(R);
  if(pend.length){document.getElementById('bl-'+pend[0].id)?.scrollIntoView({block:'start'});toast(`Confirme a presença lendo o código de barras em ${pend.length} local(is) antes de finalizar.`,'bad');return}
  const b=$('#btn-sub');b.disabled=true;
  /* ts, execId e ids ficam guardados na ronda: se o salvamento falhar no meio e o inspetor
     tentar de novo, os mesmos documentos são sobrescritos (nada fica duplicado) */
  const sub=R.sub||(R.sub={ts:Date.now(),execId:'x'+RH.uid(),ids:{}});
  const ts=sub.ts,execId=sub.execId,mk=(k,pre)=>sub.ids[k]||(sub.ids[k]=pre+RH.uid());
  let totNC=0;
  const ok=await RH.safe(async()=>{
    totNC=0;
    for(const bl of R.blocos){
      const sid=bl.id,sala=bl.tipo==='sala'?byId(S.salas,bl.salaId):null,mine=its.filter(([,i])=>i.sid===sid);
      if(!mine.length||(bl.tipo==='sala'&&!sala))continue;
      const salaNome=sala?sala.nome:'Equipamentos',setor=bl.setor==='Sem setor'?'':bl.setor,respSetor=sala?sala.responsavelId:(S.salas.find(x=>(x.setor||'Sem setor')===bl.setor&&x.responsavelId)||{}).responsavelId;
      const v=mine.map(x=>x[1]),c=v.filter(i=>i.r==='C').length,nc=v.filter(i=>i.r==='NC').length,ina=v.filter(i=>i.r==='IN').length,rid=mk('r:'+sid,'r');
      const presenca=RH.local.evidencia(R,bl);
      for(const [k,i] of mine)if(fotoObrig(i)&&i.full){const fid=mk('f:'+k,'f');await RH.put('fotos',fid,{data:i.full})}
      await RH.put('rondas',rid,{...(presenca?{presenca}:{}),ts,execId,modeloId:R.modeloId,modeloNome:R.nome,salaId:sala?sala.id:null,salaNome,setor,inspId:st.me.id,inspNome:st.me.nome,c,nc,ina,
        pct:c+nc?Math.round(c/(c+nc)*1000)/10:100,obs:(R.obs||'').trim(),itens:mine.map(([k,i])=>({a:i.a,i:i.i,n:i.n,t:i.t,r:i.r,...(i.r==='IN'?{just:i.just.trim()}:{}),...(fotoObrig(i)?{thumb:i.thumb,fotoId:mk('f:'+k,'f')}:{})}))});
      for(const [k,i] of mine.filter(([,i])=>i.r==='NC')){
        const tipo=byId(S.tiposNC,i.tipoId),eq=i.a==='e'?byId(S.equipamentos,i.i):null;let fotoId=null;
        if(i.full){fotoId=mk('f:'+k,'f');await RH.put('fotos',fotoId,{data:i.full})}
        const sev=+i.sev||tipo?.sev||2;
        await RH.put('ncs',mk('n:'+k,'n'),{ts,rondaId:rid,execId,modeloId:R.modeloId,modeloNome:R.nome,salaId:sala?sala.id:null,salaNome,setor,eqId:eq?.id||null,eqNome:eq?.nome||'',itemTexto:i.t,
          tipoId:i.tipoId,tipoNome:tipo?.nome||'',orient:tipo?.orient||'',sev,desc:i.desc.trim(),thumb:i.thumb||null,fotoId,status:'aberta',resp:respSetor||null,prazo:ts+([0,14,7,3,1][sev])*864e5,inspNome:st.me.nome});
        totNC++;
      }
    }return true});
  if(ok){RH.rondaDraft.clear();st.R=null;toast(totNC?`Ronda registrada com ${totNC} não conformidade${totNC>1?'s':''}.`:'Ronda registrada sem não conformidades.');RH.go(RH.access.gerencia()?'historico':'ronda')}
  else b.disabled=false;
}

/* ---------- câmera dentro da página ----------
   Abre a câmera do aparelho num painel próprio (getUserMedia), sem chamar o app de câmera do Android
   (que em alguns celulares falha com "insuficiência de memória" e recarrega a página). */
let camStream=null;
function camClose(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}document.getElementById('cam-ov')?.remove()}
async function camOpen(k,facing){
  camClose();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Este navegador não permite abrir a câmera aqui. Use "Da galeria".','bad');return}
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing||'environment'},width:{ideal:1280},height:{ideal:960}},audio:false})}
  catch(e){const neg=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    toast(neg?'Permissão da câmera negada. Libere a câmera para este site nas configurações do navegador, ou use "Da galeria".':'Não foi possível abrir a câmera ('+((e&&e.name)||'erro')+'). Use "Da galeria".','bad');return}
  const o=document.createElement('div');o.id='cam-ov';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Câmera');
  o.style.cssText='position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column';
  o.innerHTML=`<video id="cam-v" playsinline muted autoplay style="flex:1;min-height:0;width:100%;object-fit:contain;background:#000"></video>
  <div style="display:flex;gap:10px;justify-content:center;align-items:center;padding:14px;background:#000;flex-wrap:wrap">
  <button type="button" class="btn" id="cam-x">Cancelar</button><button type="button" class="btn pri" id="cam-shot" style="min-width:150px">${ic('cam',18)} Capturar</button><button type="button" class="btn" id="cam-sw">Trocar câmera</button></div>`;
  document.body.appendChild(o);
  const v=o.querySelector('#cam-v');v.srcObject=camStream;try{await v.play()}catch(e){}
  o.querySelector('#cam-x').onclick=camClose;
  o.querySelector('#cam-sw').onclick=()=>camOpen(k,(camStream&&camStream.getVideoTracks()[0].getSettings().facingMode)==='user'?'environment':'user');
  o.querySelector('#cam-shot').onclick=async()=>{
    if(!v.videoWidth){toast('A câmera ainda está iniciando. Tente de novo.','bad');return}
    const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));c.width=c.height=0;camClose();
    const it=st.R&&st.R.itens[k];if(!it||!blob)return;
    try{Object.assign(it,await RH.processImg(blob));repaint(k);saveDraft()}catch(err){toast('Não foi possível processar a foto.','bad')}};
}
addEventListener('pagehide',camClose);

/* ---------- eventos ---------- */
Object.assign(RH.ACT,{
  pickRonda:el=>startRonda(el.dataset.id),
  resumeRonda:()=>RH.renderView(true),
  cancelRonda:()=>{if(RH.confirmArm(RH.ACT.cancelRonda,'Toque de novo para descartar a ronda')){RH.rondaDraft.clear();st.R=null;RH.renderView(true)}},
  chkScan:async el=>{
    const bl=st.R&&st.R.blocos.find(b=>b.id===el.dataset.id);if(!bl||el.disabled)return;
    el.disabled=true;
    const reg=await RH.local.checkin(bl);
    if(!st.R)return;                                   /* ronda descartada durante a leitura */
    if(reg){RH.local.registrar(st.R,bl.id,reg);saveDraft();toast(reg.ok?'Presença confirmada.':reg.msg,reg.ok?'':'bad')}
    repaintBloco(bl.id);RH.local.dependentes(st.R,bl.id).forEach(b=>repaintBloco(b.id))},
  res:el=>{const it=st.R.itens[el.dataset.k];
    {const bl=st.R.blocos.find(b=>b.id===it.sid);if(bl&&RH.local.estado(st.R,bl).bloqueado){toast('Leia o código de barras do local antes de responder o checklist.','bad');return}}
    it.r=it.r===el.dataset.r?'':el.dataset.r;if(it.r==='NC'&&!it.sev)it.sev=2;repaint(el.dataset.k);saveDraft();if(it.r==='IN')document.getElementById('ina-'+el.dataset.k)?.focus({preventScroll:true})},
  camOpen:el=>camOpen(el.dataset.k),
  rmFoto:el=>{const it=st.R.itens[el.dataset.k];it.thumb=it.full=null;repaint(el.dataset.k);saveDraft()},
  submitRonda
});
RH.ON_CHANGE.push(async el=>{
  if(el.dataset.nc){
    const it=st.R.itens[el.dataset.k],f=el.dataset.nc;it[f]=el.value;
    if(f==='tipoId'){const t=byId(S.tiposNC,el.value);if(t)it.sev=t.sev;repaint(el.dataset.k)} /* mostra a orientação do tipo */
    saveDraft();return true}
  if(el.dataset.ncFoto!=null){
    if(el.files[0]){try{Object.assign(st.R.itens[el.dataset.k],await RH.processImg(el.files[0]));repaint(el.dataset.k);saveDraft()}catch(err){toast('Não foi possível ler a imagem.','bad')}}
    return true}
  return false});
RH.ON_INPUT.push(el=>{
  if(el.dataset.nc==='desc'){st.R.itens[el.dataset.k].desc=el.value;saveDraftSoon();return true}
  if(el.dataset.ina==='just'){st.R.itens[el.dataset.k].just=el.value;el.setCustomValidity('');saveDraftSoon();return true}
  if(el.dataset.robs!=null){st.R.obs=el.value;saveDraftSoon();return true}
  return false});
})();

</script>
<script>
/* ==========================================================================
   Histórico de rondas: uma linha por execução (ronda), com o detalhe por sala.
   ========================================================================== */
(()=>{
const RH=window.RH;
const {esc,S,st,HF,pc,fdt,ic,empty,modal,closeModal,toast,SEV}=RH;

/* Inspetor: só enxerga as rondas que ele mesmo realizou. Gestor/administrador: todas. */
const visiveis=()=>RH.access.soPropriasRondas()?S.rondas.filter(RH.access.rondaFeitaVisivel):S.rondas;
const rotulo=r=>r==='C'?'Conforme':r==='NC'?'Não conforme':'Inacessível';  /* 'NA' = registros antigos */

RH.pages.historico=()=>{
  const from=Date.now()-HF.periodo*864e5,propria=RH.access.soPropriasRondas();
  const ex=RH.execs(visiveis().filter(r=>r.ts>=from&&(!HF.ronda||r.modeloId===HF.ronda)));
  const meta=+S.cfg.meta||95;
  return `<div class="top"><div><h1>${propria?'Minhas rondas':'Histórico de rondas'}</h1><p>${ex.length} ronda${ex.length===1?'':'s'} no período${propria?' · somente as realizadas por você':''}</p></div>
  <div class="filters"><label class="field"><span>Período</span><select data-set="HF:periodo" data-num="1">${[7,30,90,365].map(d=>`<option value="${d}" ${d===HF.periodo?'selected':''}>Últimos ${d} dias</option>`).join('')}</select></label>
  <label class="field"><span>Ronda</span><select data-set="HF:ronda"><option value="">Todas as rondas</option>${[...S.modelos].sort((a,b)=>a.nome.localeCompare(b.nome)).map(m=>`<option value="${m.id}" ${m.id===HF.ronda?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></label></div></div>
  ${ex.length?`<div class="tw"><table><thead><tr><th>Data</th><th>Ronda</th><th>Inspetor</th><th>Conformidade</th><th>Itens</th><th>NCs</th></tr></thead><tbody>${ex.slice(0,200).map(e=>`<tr data-act="rondaOpen" data-id="${esc(e.id)}"><td class="num">${fdt(e.ts)}</td><td><b>${esc(e.nome)}</b><small>${qtd(e)}</small></td><td>${esc(e.inspNome)}</td><td class="num"><span class="pill ${e.pct>=meta?'okp':'st-aberta'}">${pc(e.pct)}</span></td><td class="num">${e.c+e.nc+e.ina}</td><td class="num">${e.nc||'—'}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma ronda no período','Registre uma ronda em Nova ronda.')}`;
};

/* NCs geradas por uma execução (documentos novos têm execId; antigos, só rondaId) */
const ncsDa=e=>S.ncs.filter(n=>n.execId===e.id||e.docs.some(d=>d.id===n.rondaId));

/* "2 salas · 1 equipamento" de uma execução (documentos antigos por sala continuam contando como salas) */
function qtd(e){
  const ns=e.docs.filter(r=>r.salaId||!(r.itens||[]).every(i=>i.a==='e')).length,eq=new Set();
  e.docs.forEach(r=>(r.itens||[]).forEach(i=>{if(i.a==='e')eq.add(i.i)}));
  return [ns?`${ns} sala${ns===1?'':'s'}`:'',eq.size?`${eq.size} equipamento${eq.size===1?'':'s'}`:''].filter(Boolean).join(' · ')||'—'}
function openRonda(id){
  const e=RH.execs(visiveis().filter(r=>(r.execId||r.id)===id))[0];if(!e)return;
  /* só ocorrências: itens Não conforme / Inacessível (os conformes não são listados). NCs trazem a foto capturada na ronda. */
  const ncs=ncsDa(e),ncDe=(r,i)=>ncs.find(n=>(n.rondaId===r.id||(n.execId&&n.execId===r.execId))&&n.itemTexto===i.t&&(i.a==='e'?n.eqId===i.i:!n.eqId&&n.salaId===r.salaId));
  const itemOc=(r,i)=>{
    const n=i.r==='NC'?ncDe(r,i):null;
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="display:flex;gap:10px;justify-content:space-between;align-items:center"><div style="min-width:0"><span>${esc(i.t)}</span>${i.just?`<small style="display:block;color:var(--ink2)">Motivo: ${esc(i.just)}</small>`:''}</div><span style="flex:none" class="pill ${i.r==='NC'?'st-aberta':'off'}">${rotulo(i.r)}</span></div>
    ${n?`<div style="margin-top:6px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">${n.thumb||n.fotoId?`<img class="big-img" ${n.fotoId?`data-foto="${esc(n.fotoId)}"`:''} src="${n.thumb?esc(n.thumb):''}" alt="Foto da não conformidade" style="max-width:220px;max-height:160px;object-fit:cover;border-radius:8px">`:''}
      <div style="flex:1;min-width:180px"><small style="display:block"><b>${esc(n.tipoNome||'')}</b> · severidade ${esc(SEV[n.sev]||n.sev)}</small>${n.desc?`<small style="display:block;color:var(--ink2)">${esc(n.desc)}</small>`:''}</div></div>`:''}</div>`};
  const comOc=[];
  e.docs.forEach(r=>{
    const oc=(r.itens||[]).filter(i=>i.r==='NC'||i.r==='IN'||i.r==='NA');
    if(!oc.length)return;
    const g={};oc.forEach(i=>{(g[i.a+i.i]=g[i.a+i.i]||{n:i.n,l:[]}).l.push(i)});
    comOc.push(`<div><h4 style="font-size:15px;border-bottom:2px solid var(--brand);padding-bottom:4px">${esc(r.salaNome)} <small>${esc(r.setor||'')} · ${pc(r.pct)}</small> ${RH.local.badge(r.presenca)}</h4>
    ${Object.values(g).map(x=>`<div style="margin-top:10px">${x.n===r.salaNome?'':`<b>${esc(x.n)}</b>`}<div style="margin-top:4px">${x.l.map(i=>itemOc(r,i)).join('')}</div></div>`).join('')}</div>`)});
  /* fotos obrigatórias dos itens de Temperatura (conformes; as das NCs já aparecem acima) */
  const fotosT=e.docs.flatMap(r=>(r.itens||[]).filter(i=>i.r==='C'&&(i.thumb||i.fotoId)).map(i=>`<figure style="margin:0;max-width:160px"><img class="big-img" ${i.fotoId?`data-foto="${esc(i.fotoId)}"`:''} src="${i.thumb?esc(i.thumb):''}" alt="Foto de ${esc(i.n)}" style="width:160px;height:120px;object-fit:cover;border-radius:8px"><figcaption><small><b>${esc(i.n)}</b><br>${esc(i.t)}</small></figcaption></figure>`));
  const blocoFotos=fotosT.length?`<div><h4 style="font-size:15px;border-bottom:2px solid var(--brand);padding-bottom:4px">Fotos dos equipamentos (temperatura)</h4><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px">${fotosT.join('')}</div></div>`:'';
  const porSala=(comOc.length?comOc.join(''):'<div class="empty"><b>Nenhuma não conformidade ou item inacessível</b>Todos os itens desta ronda estavam conformes.</div>');
  const obs=e.docs.map(r=>r.obs).find(Boolean),nNC=ncsDa(e).length;
  modal(`<div class="mh"><div><h3 style="font-size:16px">${esc(e.nome)}</h3><small>${fdt(e.ts)} · Inspetor: ${esc(e.inspNome)}</small></div><button class="ic-btn" data-act="closeModal" aria-label="Fechar">${ic('x',16)}</button></div>
  <div class="mb"><div class="print-only rep-h"><b>${esc(S.cfg.hospital||'Ronda Hospitalar')}</b><span>Relatório de ronda · ${esc(e.nome)} · ${fdt(e.ts)} · Inspetor: ${esc(e.inspNome)}</span></div><div class="legend"><span>Conformidade <b>${pc(e.pct)}</b></span><span>Conformes <b>${e.c}</b></span><span>Não conformes <b>${e.nc}</b></span><span>Inacessíveis <b>${e.ina}</b></span></div>
  ${obs?`<div><b>Observações</b><p style="margin:4px 0 0">${esc(obs)}</p></div>`:''}
  ${porSala}${blocoFotos}<div class="print-only rep-f"><div>Inspetor: ${esc(e.inspNome)}</div><div>Responsável pelo setor</div></div></div>
  <div class="mf">${RH.access.canDeleteRonda()?`<button type="button" class="btn bad sp" data-act="delRonda" data-id="${esc(e.id)}" id="btn-delronda">${ic('trash',16)} Excluir ronda</button>
    <label class="chk" style="margin-right:auto"><input type="checkbox" id="del-ncs" ${nNC?'':'disabled'}> Excluir também as ${nNC} não conformidade${nNC===1?'':'s'} geradas</label>`:''}
    <button type="button" class="btn" data-act="printRonda">Imprimir relatório</button><button type="button" class="btn" data-act="closeModal">Fechar</button></div>`,true);
  /* troca a miniatura pela foto completa (coleção fotos) */
  document.querySelectorAll('#modal img[data-foto]').forEach(img=>st.db.doc('fotos/'+img.dataset.foto).get().then(d=>{if(d.exists&&img.isConnected)img.src=d.data().data}).catch(()=>{}));
}
/* exclusão em dois toques; apaga os documentos da execução e, se marcado, as NCs (e fotos) */
function imprimir(){document.body.classList.add('print-modal');const f=()=>{document.body.classList.remove('print-modal');removeEventListener('afterprint',f)};addEventListener('afterprint',f);print()}
async function delRonda(el){
  if(!RH.access.canDeleteRonda())return;
  if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Confirmar exclusão';return}
  const e=RH.execs(S.rondas.filter(r=>(r.execId||r.id)===el.dataset.id))[0];if(!e)return;
  const comNC=document.getElementById('del-ncs')?.checked,ncs=comNC?ncsDa(e):[];
  const ok=await RH.safe(async()=>{
    for(const n of ncs){await RH.del('ncs',n.id);if(n.fotoId)await RH.del('fotos',n.fotoId)}
    for(const d of e.docs){for(const i of d.itens||[])if(i.r==='C'&&i.fotoId)await RH.del('fotos',i.fotoId);await RH.del('rondas',d.id)}
    return true});
  if(ok){closeModal();toast('Ronda excluída'+(ncs.length?` junto com ${ncs.length} não conformidade${ncs.length===1?'':'s'}.`:'.'))}
}
RH.ACT.rondaOpen=el=>openRonda(el.dataset.id);
RH.ACT.delRonda=delRonda;
RH.ACT.printRonda=imprimir;
})();

</script>
<script>
/* ==========================================================================
   Não conformidades: lista com filtros, tratamento (situação, responsável, prazo,
   ação corretiva) e exclusão (administrador e gestor, com confirmação).
   ========================================================================== */
(()=>{
const RH=window.RH;
const {$,esc,S,NF,st,byId,userName,fd,fdt,ic,empty,sevPill,stPill,ST,SEV,toast,modal,closeModal}=RH;

function filtrar(){
  const q=NF.q.trim().toLowerCase();
  return S.ncs.filter(n=>(NF.status==='todas'||(NF.status==='abertas'?n.status!=='resolvida':n.status===NF.status))&&(!NF.sev||n.sev==NF.sev)&&(!NF.setor||n.setor===NF.setor)&&(!q||[n.desc,n.salaNome,n.eqNome,n.tipoNome,n.itemTexto,n.modeloNome].join(' ').toLowerCase().includes(q)))}

function lista(){
  const l=filtrar();if(!l.length)return empty('Nenhuma não conformidade com estes filtros');
  return `<div class="ncs">${l.slice(0,150).map(n=>{const late=n.status!=='resolvida'&&n.prazo&&n.prazo<Date.now();
    return `<button class="nc s${n.sev}" data-act="ncOpen" data-id="${n.id}">${n.thumb?`<img class="thumb" src="${n.thumb}" alt="">`:`<div class="thumb">${ic('alert',20)}</div>`}
    <div style="min-width:0"><b>${esc(n.tipoNome||'Não conformidade')} · ${esc(n.eqNome||n.salaNome)}</b><p>${esc(n.desc||n.itemTexto)}</p><div class="meta"><span>${esc(n.salaNome)}${n.setor?' · '+esc(n.setor):''}</span>${n.modeloNome?`<span>Ronda: ${esc(n.modeloNome)}</span>`:''}<span>${fdt(n.ts)}</span><span>Resp.: ${esc(userName(n.resp))}</span>${n.status!=='resolvida'&&n.prazo?`<span style="${late?'color:var(--bad);font-weight:600':''}">Prazo ${fd(n.prazo)}${late?' (vencido)':''}</span>`:''}</div></div>
    <div class="right">${sevPill(n.sev)}${stPill(n.status)}</div></button>`}).join('')}</div>${l.length>150?`<p class="hint">Mostrando 150 de ${l.length}. Use os filtros para refinar.</p>`:''}`}
RH.ncList=lista;

RH.pages.ncs=()=>{
  const setores=[...new Set(S.ncs.map(n=>n.setor).filter(Boolean))].sort();
  const opened=S.ncs.filter(n=>n.status!=='resolvida').length;
  return `<div class="top"><div><h1>Não conformidades</h1><p>${opened} em aberto · ${S.ncs.length} registradas</p></div></div>
  <div class="filters" style="margin-bottom:14px"><div class="chips" role="group" aria-label="Situação">${[['abertas','Em aberto'],['aberta','Abertas'],['tratamento','Em tratamento'],['resolvida','Resolvidas'],['todas','Todas']].map(([v,l])=>`<button class="chip" data-act="ncStatus" data-v="${v}" aria-pressed="${NF.status===v}">${l}</button>`).join('')}</div></div>
  <div class="filters" style="margin-bottom:14px"><label class="field"><span>Severidade</span><select data-set="NF:sev"><option value="">Todas</option>${[4,3,2,1].map(s=>`<option value="${s}" ${NF.sev==s?'selected':''}>${SEV[s]}</option>`).join('')}</select></label>
  <label class="field"><span>Setor</span><select data-set="NF:setor"><option value="">Todos</option>${setores.map(s=>`<option ${NF.setor===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
  <label class="field" style="flex:1;min-width:200px"><span>Buscar</span><input type="text" id="nc-q" data-set="NF:q" data-live="nc" value="${esc(NF.q)}" placeholder="Sala, equipamento, ronda, descrição…"></label></div>
  <div id="nc-list">${lista()}</div>`;
};

function openNC(id){
  const n=byId(S.ncs,id);if(!n)return;
  const edit=RH.access.canEditNC(),canDel=RH.access.canDeleteNC();
  const users=S.users.filter(u=>u.ativo!==false);
  const orient=n.orient||byId(S.tiposNC,n.tipoId)?.orient||'';
  modal(`<div class="mh"><div><h3 style="font-size:16px">${esc(n.tipoNome||'Não conformidade')}</h3><small>${esc(n.salaNome)}${n.eqNome?' · '+esc(n.eqNome):''}</small></div><button class="ic-btn" data-act="closeModal" aria-label="Fechar">${ic('x',16)}</button></div>
  <form id="f-nc" data-id="${n.id}"><div class="mb">
  ${n.fotoId?`<div id="nc-foto">${n.thumb?`<img class="big-img" src="${n.thumb}" alt="Foto da não conformidade" style="max-height:200px;object-fit:cover">`:''}<small>Carregando foto…</small></div>`:''}
  ${RH.orientBox(orient)}
  <dl class="kv"><dt>Descrição</dt><dd>${esc(n.desc)}</dd><dt>Item do checklist</dt><dd>${esc(n.itemTexto||'—')}</dd>${n.modeloNome?`<dt>Ronda</dt><dd>${esc(n.modeloNome)}</dd>`:''}<dt>Registrada</dt><dd>${fdt(n.ts)} por ${esc(n.inspNome||'—')}</dd><dt>Severidade</dt><dd>${sevPill(n.sev)}</dd></dl>
  <div class="fg"><label class="field"><span>Situação</span><select name="status" ${edit?'':'disabled'}>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${n.status===k?'selected':''}>${v}</option>`).join('')}</select></label>
  <label class="field"><span>Responsável pela correção</span><select name="resp" ${edit?'':'disabled'}><option value="">—</option>${users.map(u=>`<option value="${u.id}" ${n.resp===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></label>
  <label class="field"><span>Prazo</span><input type="date" name="prazo" value="${n.prazo?RH.ymd(n.prazo):''}" ${edit?'':'disabled'}></label>
  <label class="field"><span>Severidade</span><select name="sev" ${edit?'':'disabled'}>${[1,2,3,4].map(s=>`<option value="${s}" ${n.sev==s?'selected':''}>${s} · ${SEV[s]}</option>`).join('')}</select></label>
  <label class="field full"><span>Ação corretiva / resolução</span><textarea name="resolucao" ${edit?'':'disabled'} placeholder="O que foi feito para corrigir?">${esc(n.resolucao||'')}</textarea></label></div>
  ${n.resolvidoEm?`<small>Resolvida em ${fdt(n.resolvidoEm)}</small>`:''}<div class="err" id="nc-err" role="alert"></div></div>
  <div class="mf">${canDel?`<button type="button" class="btn bad sp" data-act="delNC" data-id="${n.id}" id="btn-delnc">${ic('trash',16)} Excluir</button>`:''}${edit?`<button type="button" class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" type="submit">Salvar</button>`:`<button type="button" class="btn" data-act="closeModal">Fechar</button>`}</div></form>`,true);
  if(n.fotoId)st.db.doc('fotos/'+n.fotoId).get().then(s=>{const b=$('#nc-foto');if(!b)return;b.innerHTML=s.exists?`<img class="big-img" src="${esc(s.data().data)}" alt="Foto da não conformidade">`:'<small>Foto indisponível.</small>'}).catch(()=>{});
}

async function saveNC(f){
  const n=byId(S.ncs,f.dataset.id);if(!n||!RH.access.canEditNC())return;
  const fm=new FormData(f),situ=fm.get('status');
  const d={status:situ,resp:fm.get('resp')||null,sev:+fm.get('sev'),resolucao:(fm.get('resolucao')||'').trim(),prazo:fm.get('prazo')?new Date(fm.get('prazo')+'T12:00:00').getTime():null};
  if(situ==='resolvida'&&!n.resolvidoEm)d.resolvidoEm=Date.now();
  if(situ!=='resolvida'&&n.resolvidoEm)d.resolvidoEm=null;
  if(situ==='resolvida'&&!d.resolucao){toast('Descreva a ação corretiva para marcar como resolvida.','bad');return}
  const ok=await RH.safe(async()=>{await RH.upd('ncs',n.id,d);return true});
  if(ok){closeModal();toast('Não conformidade atualizada.')}
}

/* exclusão em dois toques: o 1º toque pede confirmação, o 2º exclui (a foto também) */
async function delNC(el){
  if(!RH.access.canDeleteNC())return;
  if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Confirmar exclusão';return}
  const n=byId(S.ncs,el.dataset.id);if(!n)return;
  const ok=await RH.safe(async()=>{await RH.del('ncs',n.id);if(n.fotoId)await RH.del('fotos',n.fotoId);return true});
  if(ok){closeModal();toast('Não conformidade excluída.')}
}

Object.assign(RH.ACT,{
  ncOpen:el=>openNC(el.dataset.id),
  ncStatus:el=>{NF.status=el.dataset.v;RH.renderView()},
  delNC:el=>delNC(el)
});
RH.ON_INPUT.push(el=>{if(el.dataset.live==='nc'){NF.q=el.value;$('#nc-list').innerHTML=lista();return true}return false});
RH.ON_SUBMIT['f-nc']=saveNC;
})();

</script>
<script>

/* coluna "Presença": código cadastrado? quantas antenas? */

const TIPO_CK={sala:'Sala',equipamento:'Equipamento',ambos:'Sala e equipamento'};
const ENT={
 modelos:{col:'modelos',nome:'Rondas',um:'ronda',

    hint:'Somente o responsável escolhido vê e realiza esta ronda. Com "Todos", todos os inspetores podem realizá-la.'},
   {k:'ativo',l:'Ronda ativa',t:'check',def:true,full:1},
   {k:'agenda',l:'Dias e horários da ronda',t:'agenda',full:1},

 salas:{col:'salas',nome:'Salas',um:'sala',

   {k:'responsavelId',l:'Responsável pela sala (recebe as NCs)',t:'select',full:1,opts:()=>usersAtivos().map(u=>[u.id,u.nome+(u.cargo?' · '+u.cargo:'')]),blank:'Todos',tab:'geral'},
   {k:'itens',l:'Checklist',t:'items',full:1,tab:'geral'},

   {k:'codigoLocal',l:'Código de barras do local',t:'codigo',full:1,hint:'Valor do código (Code 128, QR etc.) impresso e fixado neste local. Deixe vazio para não verificar a presença aqui.',tab:'presenca'},
   {k:'bssids',l:'Antenas Wi-Fi (BSSID) que cobrem este local',t:'bssids',full:1,hint:'Um por linha, ex.: aa:bb:cc:dd:ee:ff. Use aa:bb:cc:dd:*:* para antenas com vários rádios. Só é conferido no aplicativo Android.',tab:'presenca'}],
  canDel:s=>S.modelos.some(m=>(m.salaIds||[]).includes(s.id))?'Esta sala faz parte de uma ronda. Remova-a da ronda antes de excluir. Ou apenas desative a sala.':''},
 equipamentos:{col:'equipamentos',nome:'Equipamentos',um:'equipamento',
  cols:[['Equipamento',e=>`<div style="display:flex;gap:10px;align-items:center">${RH.thumbEq(e)}<div><b>${esc(e.nome)}</b></div></div>`],['Setor',e=>esc(RH.setorEq(e)||'—')],['Presença',presencaCol],['Situação',actPill]],
  tabs:[['geral','Geral'],['presenca','Presença no local']],
  fields:[{k:'nome',l:'Nome do equipamento',req:1,full:1,tab:'geral'},
   {k:'setor',l:'Setor',req:1,full:1,list:optsSetor,hint:'Setor onde o equipamento fica. Ex.: UTI, Centro Cirúrgico',tab:'geral'},
   {k:'itens',l:'Checklist',t:'items',full:1,tab:'geral'},
