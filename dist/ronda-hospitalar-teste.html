<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f3a">
<title>Ronda Hospitalar</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a6c7d'/%3E%3Cpath d='M26 12h12v14h14v12H38v14H26V38H12V26h14z' fill='white'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('rh_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ==========================================================================
   Ronda Hospitalar — estilos
   Layout: sidebar escura fixa + área de trabalho clara; painel em grade de
   cartões; ronda em fluxo vertical de itens.
   ========================================================================== */

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

/* ---------- tema ---------- */
:root{
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f7f9fb; --ink:#12263a; --ink2:#475a6e; --muted:#6b7d8f;
  --line:#dde4eb; --line2:#c8d3de; --grid:#e8edf2;
  --brand:#0b5a8f; --brand-h:#084670; --brand-soft:#e4f0f8; --on-brand:#ffffff;
  --side:#0b2740; --side-ink:#c5d6e6; --side-active:#143a5c; --side-line:#1d4163;
  --ok:#0c7a3a; --ok-bg:#e3f4ea; --warn:#855400; --warn-bg:#fdf0d0; --bad:#b42323; --bad-bg:#fbe5e5; --info:#1c5cab; --info-bg:#e4eefb;
  --s1:#fab219; --s2:#ec835a; --s3:#d03b3b; --s4:#7a1a28;
  --c1:#1f6fc2; --good:#0ca30c;
  --shadow:0 1px 2px rgba(18,38,58,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1520; --surface:#101f2d; --surface2:#142636; --ink:#e6eff7; --ink2:#a8bccd; --muted:#8aa1b4;
  --line:#213548; --line2:#2d465d; --grid:#1a2b3b;
  --brand:#4aa3dc; --brand-h:#75bbe8; --brand-soft:#12304a; --on-brand:#04192a;
  --side:#0b1b2b; --side-ink:#a8bfd3; --side-active:#153552; --side-line:#1a3248;
  --ok:#4cc27f; --ok-bg:#12301f; --warn:#f0b84a; --warn-bg:#33270c; --bad:#ff8585; --bad-bg:#3a1616; --info:#79b0f0; --info-bg:#14263d;
  --s4:#c2465a; --c1:#3987e5; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1520; --surface:#101f2d; --surface2:#142636; --ink:#e6eff7; --ink2:#a8bccd; --muted:#8aa1b4;
  --line:#213548; --line2:#2d465d; --grid:#1a2b3b;
  --brand:#4aa3dc; --brand-h:#75bbe8; --brand-soft:#12304a; --on-brand:#04192a;
  --side:#0b1b2b; --side-ink:#a8bfd3; --side-active:#153552; --side-line:#1a3248;
  --ok:#4cc27f; --ok-bg:#12301f; --warn:#f0b84a; --warn-bg:#33270c; --bad:#ff8585; --bad-bg:#3a1616; --info:#79b0f0; --info-bg:#14263d;
  --s4:#c2465a; --c1:#3987e5; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em} h3{font-size:14px} small{color:var(--muted);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--side-line);margin-bottom:12px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.brand b{display:block;color:#fff;font-size:14px;line-height:1.2} .brand span{font-size:11.5px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--side-ink);font-weight:500}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.nav button:focus-visible{outline:2px solid #fff}
.nav .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--s1)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--side-line);padding-top:12px}
.me{display:flex;gap:10px;align-items:center;padding:4px 8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--side-active);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.me b{display:block;color:#fff;font-size:13px;line-height:1.2} .me span{font-size:11.5px;opacity:.75}
.side-foot .row{display:flex;gap:6px}
.ghost-d{all:unset;box-sizing:border-box;flex:1 1 0;min-width:0;display:flex;gap:5px;align-items:center;justify-content:center;padding:8px 4px;border-radius:8px;border:1px solid var(--side-line);cursor:pointer;font-size:12.5px;color:var(--side-ink)}
.ghost-d:hover{background:var(--side-active)} .ghost-d:focus-visible{outline:2px solid #fff}
main{min-width:0;padding:22px clamp(16px,3vw,34px) 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top p{margin:2px 0 0;color:var(--ink2)}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--line2);padding:10px 14px;border-radius:8px;margin-bottom:14px}

/* ---------- controles ---------- */
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;min-height:38px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)} .btn.pri:hover{background:var(--brand-h)}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;min-height:38px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:2px solid var(--brand-soft)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;box-sizing:border-box;padding:10px 16px;cursor:pointer;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--brand)}

/* ---------- cartões e indicadores ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline} .card h3 small{font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi label{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em;display:block}
.kpi strong{display:block;font-size:30px;line-height:1.15;margin:4px 0 2px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi small{display:block}
.kpi .good{color:var(--ok)} .kpi .badc{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
.empty{padding:22px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:10px}
.empty b{display:block;color:var(--ink2);margin-bottom:2px}

/* ---------- gráficos ---------- */
.hb{display:flex;flex-direction:column;gap:9px}
.hb-r{display:grid;grid-template-columns:minmax(80px,38%) 1fr 44px;gap:10px;align-items:center}
.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);font-size:13px}
.hb-t{height:14px;background:var(--grid);border-radius:4px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.seg-bar{display:flex;height:16px;gap:2px;border-radius:6px;overflow:hidden;margin:6px 0 12px}
.seg-bar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center} .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
#ch-line{width:100%}
#ch-line svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12.5px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip[hidden]{display:none}

/* ---------- tabelas e listas ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer} tbody tr[data-act]:hover{background:var(--surface2)}
td small{display:block}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;gap:6px;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-aberta{background:var(--bad-bg);color:var(--bad)} .st-tratamento{background:var(--warn-bg);color:var(--warn)} .st-resolvida{background:var(--ok-bg);color:var(--ok)}
.pill.late{background:var(--warn-bg);color:var(--warn)} .pill.okp{background:var(--ok-bg);color:var(--ok)} .pill.off{background:var(--grid);color:var(--muted)} .pill.inf{background:var(--info-bg);color:var(--info)}
.sev{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;white-space:nowrap}
.sev b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;color:#1a1200;font-size:11px}
.sev.s1 b{background:var(--s1)} .sev.s2 b{background:var(--s2)} .sev.s3 b{background:var(--s3);color:#fff} .sev.s4 b{background:var(--s4);color:#fff}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--grid);display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);flex:none}
img.thumb{display:block}
.ncs{display:flex;flex-direction:column;gap:10px}
.nc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.nc:hover{background:var(--surface2)}
.nc.s1{border-left-color:var(--s1)} .nc.s2{border-left-color:var(--s2)} .nc.s3{border-left-color:var(--s3)} .nc.s4{border-left-color:var(--s4)}
.nc b{display:block} .nc p{margin:2px 0 4px;color:var(--ink2);overflow-wrap:anywhere}
.nc .meta{display:flex;gap:6px 12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.nc .right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* ---------- ronda ---------- */
.salas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.sala{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.sala:hover{border-color:var(--brand)}
.sala .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sala b{font-size:15px} .sala .f{display:flex;gap:6px 12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.rhead{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.prog{flex:1;min-width:180px}
.prog .bar{height:8px;background:var(--grid);border-radius:99px;overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--brand);transition:width .2s}
.sala-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--brand)}
.sala-h:first-of-type{margin-top:8px}
.sala-h h2{font-size:17px} .sala-h small{font-size:12.5px}
.grp{margin-bottom:16px}
.grp>.gh{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 0 0}
.grp>.gh .t{flex:1;min-width:0} .grp>.gh b{display:block;overflow-wrap:anywhere}
.grp>.items{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--surface)}
.grp.noitems>.gh{border-radius:12px}
.it{padding:12px 14px;border-bottom:1px solid var(--line)} .it:last-child{border-bottom:0}
.it-row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.it-t{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:40px;font-weight:600;font-size:13px;border-right:1px solid var(--line2);color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].c{background:#0c7a3a;color:#fff}
.seg button[aria-pressed="true"].n{background:#b42323;color:#fff}
.seg button[aria-pressed="true"].a{background:#5d727a;color:#fff}
.ncp{margin-top:10px;background:var(--bad-bg);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ncp .full{grid-column:1/-1}
.ncp .ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ncp .ph img{width:64px;height:64px;border-radius:8px;object-fit:cover}
.it.miss{box-shadow:inset 3px 0 0 var(--bad);background:var(--bad-bg)}
/* orientação da não conformidade (alerta ao inspetor) */
.orient{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-left-width:5px;border-radius:8px;padding:10px 12px;font-size:13.5px;overflow-wrap:anywhere}
.orient svg{margin-top:2px}
.orient b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
details.guide{margin-bottom:12px} details.guide summary{cursor:pointer;font-weight:600}
.guide-l{display:grid;gap:8px;margin-top:10px}
.guide-l div{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.guide-l p{margin:2px 0 0;color:var(--ink2)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(8,22,38,.6);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:4vh 16px;overflow-y:auto}
.mod{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(0,0,0,.35);margin:auto 0}
.mod.wide{max-width:820px}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mb{padding:18px 20px;display:grid;gap:14px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{margin-right:auto}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.pw:not(.show){-webkit-text-security:disc}
.chk{display:flex;gap:8px;align-items:center;font-weight:500} .chk input{width:18px;height:18px}
.chk-list{border:1px solid var(--line2);border-radius:8px;padding:8px 12px;max-height:260px;overflow-y:auto;display:grid;gap:4px;background:var(--surface)}
.chk-list .gt{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px;font-weight:600}
.chk-list .chk{font-weight:400;padding:3px 0}
.irow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.irow input{flex:1}
.ic-btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--ink2)}
.ic-btn:hover{background:var(--surface2)}
.big-img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--grid)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13.5px} .kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}

/* ---------- login / primeiro acesso ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-l{background:var(--side);color:#fff;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-l h2{font-size:clamp(26px,3.2vw,38px);font-weight:600;letter-spacing:-.02em;max-width:16ch;line-height:1.15}
.auth-l p{max-width:44ch;color:var(--side-ink);margin:14px 0 0}
.auth-l ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;color:var(--side-ink)} .auth-l li{display:flex;gap:10px;align-items:center}
.auth-r{display:grid;place-items:center;padding:32px 16px}
.auth-card{width:100%;max-width:380px;display:grid;gap:16px}
.err{color:var(--bad);font-weight:500;min-height:20px}
.prog-seed{height:8px;background:var(--grid);border-radius:99px;overflow:hidden} .prog-seed i{display:block;height:100%;background:var(--brand);width:0}

/* ---------- responsivo ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
  .brand{border:0;margin:0;padding:0}

<div id="app"></div>
<div id="modal"></div>
<div id="tip" class="tip" hidden></div>
<div id="toast"></div>

<!-- Configuração (único arquivo a editar para ligar o banco compartilhado) -->
<script>
window.RONDA_CONFIG={supabaseUrl:'',supabaseKey:''};
</script>

<!-- Núcleo (a ordem importa): dados, utilitários, estado, permissões, segurança, imagens, interface, acesso aos dados -->
<script>
/* ==========================================================================
   Camada de dados
   - Sem configuração (js/config.js vazio): guarda tudo neste navegador (IndexedDB).
   - Com RONDA_CONFIG preenchido: usa o banco compartilhado (Supabase) protegido por
     um código de acesso da equipe, via funções SQL (veja supabase-setup.sql).
   API exposta: window.RH.store  →  { mode, open(), volatile(), exportJSON(), importJSON(), wipeAll(), changeCode() }
   `open()` devolve um objeto com collection(nome) e doc('colecao/id') no estilo Firestore.
   ========================================================================== */
(()=>{
const RH=window.RH=window.RH||{};
const CFG=window.RONDA_CONFIG||{},RAWURL=String(CFG.supabaseUrl||'').trim(),KEY=String(CFG.supabaseKey||'').trim(),REMOTE=!!(RAWURL||KEY);

/* aceita só o endereço do projeto; remove caminhos colados por engano (/rest/v1, link do painel etc.) */
function normUrl(u){if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{const x=new URL(u),m=/(^|\.)supabase\.com$/.test(x.hostname)&&x.pathname.match(/\/project\/([a-z0-9]+)/i);return m?'https://'+m[1]+'.supabase.co':x.origin}catch(e){return ''}}
const BASE=normUrl(RAWURL);
function keyProblem(){
  if(!KEY)return 'A chave (supabaseKey) não foi preenchida em js/config.js.';
  let role='';try{if(KEY.startsWith('eyJ'))role=JSON.parse(atob(KEY.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role}catch(e){}
  if(KEY.startsWith('sb_secret_')||role==='service_role')return 'Esta é a chave SECRETA do projeto e nunca deve ficar em um site. Use a chave anon (ou publishable) em Project Settings → API.';
  return ''}

const DB='ronda-hospitalar',ST='docs',mem=new Map(),subs=new Set();
let idb=null,bc=null,volatile=false,code='';
const clone=o=>JSON.parse(JSON.stringify(o));
const err=(c,m)=>Object.assign(new Error(m),{code:c,message:m});
const split=p=>{const i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)]};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let pend=false;const notify=()=>{if(pend)return;pend=true;queueMicrotask(()=>{pend=false;subs.forEach(s=>s.run())})};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- modo local (IndexedDB) ---------- */
const L={
  open(){return new Promise(res=>{try{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'p'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})},
  tx(mode,fn){return new Promise((res,rej)=>{if(!idb)return res();const t=idb.transaction(ST,mode);fn(t.objectStore(ST));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  async loadAll(){mem.clear();if(!idb)return;await new Promise((res,rej)=>{const r=idb.transaction(ST).objectStore(ST).getAll();r.onsuccess=()=>{r.result.forEach(x=>mem.set(x.p,x.d));res()};r.onerror=()=>rej(r.error)})},
  async persist(p,d){if(d===null)await L.tx('readwrite',s=>s.delete(p));else await L.tx('readwrite',s=>s.put({p,d}));try{bc&&bc.postMessage(1)}catch(e){}},
  async init(){idb=await L.open();if(!idb){volatile=true;console.warn('IndexedDB indisponível: dados só ficam na memória desta aba.')}
    try{await L.loadAll()}catch(e){console.error(e)}
    try{bc=new BroadcastChannel(DB);bc.onmessage=async()=>{try{await L.loadAll();notify()}catch(e){}}}catch(e){}}
};

/* ---------- modo compartilhado (Supabase) ---------- */
let badge=null;
function status(ok,msg){
  if(ok){if(badge){badge.remove();badge=null}return}
  if(!badge){badge=document.createElement('div');badge.setAttribute('role','status');badge.style.cssText='position:fixed;left:12px;bottom:12px;z-index:95;background:var(--warn-bg,#fdf0d0);color:var(--warn,#855400);border:1px solid var(--line2,#ccc);padding:8px 12px;border-radius:10px;font:500 13px var(--font,system-ui);box-shadow:0 4px 14px rgba(0,0,0,.2)';document.body.appendChild(badge)}
  badge.textContent=msg||'Sem conexão com o servidor. Tentando novamente…'}
async function rpc(fn,args){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000),h={'Content-Type':'application/json',apikey:KEY};
  if(KEY.startsWith('eyJ'))h.Authorization='Bearer '+KEY;
  let r;try{r=await fetch(`${BASE}/rest/v1/rpc/${fn}`,{method:'POST',headers:h,body:JSON.stringify({p_code:code,...args}),signal:ctl.signal})}
  catch(e){throw Object.assign(err('unavailable','Sem conexão com o servidor.'),{net:true})}finally{clearTimeout(t)}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.hint))||txt||('HTTP '+r.status);throw Object.assign(err(/codigo_invalido/.test(m)?'bad_code':'unavailable',m),{status:r.status})}
  return j}
function overlay(html){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:100;background:var(--bg,#f2f5f6);color:var(--ink,#0e2830);display:grid;place-items:center;padding:16px;font:14px/1.5 var(--font,system-ui)';
  o.innerHTML=`<div style="width:100%;max-width:400px;display:grid;gap:14px;background:var(--surface,#fff);border:1px solid var(--line,#dce5e8);border-radius:14px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.12)">${html}</div>`;document.body.appendChild(o);return o}
function askCode(msg){return new Promise(res=>{
  const o=overlay(`<h1 style="margin:0;font-size:20px">Código de acesso da equipe</h1><p style="margin:0;color:var(--ink2,#46606a)">Digite o código fornecido pelo administrador para abrir a base de dados compartilhada. Ele fica salvo neste aparelho.</p>
  <form id="rh-code" style="display:grid;gap:12px"><input id="rh-code-i" type="password" autocomplete="off" required placeholder="Código de acesso" style="width:100%;padding:10px 12px;border:1px solid var(--line2,#c6d4d9);border-radius:8px;background:var(--surface,#fff);color:inherit;font:inherit;min-height:40px"><div role="alert" style="color:var(--bad,#b42323);font-weight:500;min-height:20px">${msg||''}</div>
  <button style="background:var(--brand,#0a6c7d);color:var(--on-brand,#fff);border:0;border-radius:8px;padding:10px;font:600 14px var(--font,system-ui);min-height:40px;cursor:pointer">Continuar</button></form>`);
  const i=o.querySelector('#rh-code-i');i.focus();o.querySelector('form').onsubmit=e=>{e.preventDefault();o.remove();res(i.value.trim())}})}
function fatal(msg){return new Promise(res=>{const o=overlay(`<h1 style="margin:0;font-size:20px">Não foi possível conectar</h1><p style="margin:0;color:var(--ink2,#46606a)">${msg}</p><button style="background:var(--brand,#0a6c7d);color:var(--on-brand,#fff);border:0;border-radius:8px;padding:10px;font:600 14px var(--font,system-ui);min-height:40px;cursor:pointer">Tentar novamente</button>`);o.querySelector('button').onclick=()=>{o.remove();res()}})}
function explain(e){
  const m=String(e.message||'');
  if(e.net)return 'Verifique sua internet e tente de novo.';
  if(/Invalid path|Invalid URL|Not Found/i.test(m)&&!/function/i.test(m))return 'A URL do projeto parece incorreta. Use apenas o endereço no formato https://xxxxxxxx.supabase.co (Supabase → Project Settings → API → Project URL).';
  if(e.status===401||e.status===403||/Invalid API key|JWT|apikey/i.test(m))return 'A chave do projeto foi recusada. Copie a chave anon (ou publishable) em Supabase → Project Settings → API.';
  if(/Could not find the function|PGRST202|schema cache/i.test(m))return 'O script supabase-setup.sql ainda não foi executado neste projeto. Rode-o no SQL Editor do Supabase e tente de novo.';
  return 'O servidor recusou a conexão ('+esc(m)+'). Confira a URL e a chave em js/config.js e se o script supabase-setup.sql foi executado.'}
async function authenticate(msg){
  for(;;){
    const kp=keyProblem();if(!BASE){await fatal('A URL em js/config.js (supabaseUrl) está vazia ou inválida. Use o formato https://xxxxxxxx.supabase.co.');continue}
    if(kp){await fatal(esc(kp));continue}
    if(!code){try{code=localStorage.getItem('rh_code')||''}catch(e){}}
    if(!code){try{await rpc('rh_check',{})}catch(e){if(e.code!=='bad_code'){await fatal(explain(e));continue}}
      code=await askCode(msg);msg=''}
    try{await rpc('rh_check',{});try{localStorage.setItem('rh_code',code)}catch(e){}return}
    catch(e){

<script>
/* ==========================================================================
   Núcleo · estado da aplicação
   - RH.S   : cópia local dos cadastros e registros (atualizada em tempo real).
   - RH.st  : estado da interface (usuário logado, tela atual, ronda em andamento…).
   - RH.F / NF / HF : filtros do Painel, das Não conformidades e do Histórico.
   - Registros onde cada tela se "pluga": RH.pages, RH.after, RH.ACT,
     RH.ON_CHANGE, RH.ON_INPUT, RH.ON_SUBMIT (despachados em js/app.js).
   - Funções de consulta usadas por várias telas (byId, salasDaRonda, execs).
   ========================================================================== */
(()=>{
const RH=window.RH;

/* coleções do banco → RH.S[coleção]; "config" vira RH.S.cfg */
RH.COLS=['users','salas','equipamentos','checklists','tiposNC','modelos','rondas','ncs','config'];
const S=RH.S={users:[],salas:[],equipamentos:[],checklists:[],tiposNC:[],modelos:[],rondas:[],ncs:[],cfg:{}};

RH.st={
  db:null,          // banco (collection/doc) aberto por RH.store.open()
  me:null,          // usuário logado
  page:'painel',    // tela atual
  screen:'',        // 'noaccess' | 'login' | 'setup' | 'app' (evita redesenhar à toa)
  busy:false,       // true durante operações longas (não redesenha a tela)
  booted:false,     // true quando todas as coleções chegaram pela 1ª vez
  canWrite:true,
  R:null,           // ronda em andamento (preenchimento)
  M:null,           // formulário de cadastro aberto (modal)
  cadTab:'modelos'  // aba atual de Cadastros
};

RH.F={periodo:30,setor:''};
RH.NF={status:'abertas',sev:'',setor:'',q:''};
RH.HF={ronda:'',periodo:30};

RH.pages={};       // pages[nome]() → HTML da tela
RH.after={};       // after[nome]() → roda depois de desenhar a tela (ex.: gráfico)
RH.ACT={};         // ACT[data-act](elemento, evento) → cliques
RH.ON_CHANGE=[];   // funções (el,e) → true se tratou o evento "change"
RH.ON_INPUT=[];    // idem para "input"
RH.ON_SUBMIT={};   // ON_SUBMIT[id do form](form)

/* ---------- consultas ---------- */
const byId=(a,id)=>a.find(x=>x.id===id);
RH.byId=byId;
RH.userName=id=>byId(S.users,id)?.nome||'—';

/* salas ativas de uma ronda cadastrada, na ordem salva */
/* setor de um equipamento (cadastros antigos só tinham a sala: usa o setor dela) */
RH.setorEq=e=>e.setor||byId(S.salas,e.salaId)?.setor||'';

RH.equipsDaRonda=m=>(Array.isArray(m.equipIds)?m.equipIds.map(id=>byId(S.equipamentos,id)):S.equipamentos.filter(e=>e.salaId&&(m.salaIds||[]).includes(e.salaId))).filter(e=>e&&e.ativo!==false);
/* ordem de percurso da ronda: lista de 's:<id>' (sala) e 'e:<id>' (equipamento).
   Rondas antigas, sem 'ordem', seguem a ordem por setor (salas e depois equipamentos de cada setor). */
RH.ordemDaRonda=m=>{
  const existe=k=>k[0]==='s'?!!byId(S.salas,k.slice(2)):!!byId(S.equipamentos,k.slice(2));
  if(Array.isArray(m.ordem))return m.ordem.filter(existe);
  const sd=x=>x||'Sem setor',salas=(m.salaIds||[]).map(id=>byId(S.salas,id)).filter(Boolean),eqs=RH.equipsDaRonda(m),ks=[];
  salas.forEach(s=>{if(!ks.includes(sd(s.setor)))ks.push(sd(s.setor))});
  eqs.forEach(e=>{const k=sd(RH.setorEq(e));if(!ks.includes(k))ks.push(k)});
  const o=[];ks.forEach(k=>{salas.filter(s=>sd(s.setor)===k).forEach(s=>o.push('s:'+s.id));eqs.filter(e=>sd(RH.setorEq(e))===k).forEach(e=>o.push('e:'+e.id))});
  return o};
RH.salasDaRonda=m=>(m.salaIds||[]).map(id=>byId(S.salas,id)).filter(s=>s&&s.ativo!==false);

/* Uma "execução" de ronda grava um documento por sala visitada, todos com o mesmo
   execId. Esta função junta os documentos de volta em uma linha por execução.
   Documentos antigos (sem execId) viram uma execução própria. */
RH.execs=list=>{
  const g=new Map();
  list.forEach(r=>{
    const k=r.execId||r.id;let e=g.get(k);
    if(!e){e={id:k,nome:r.modeloNome||r.salaNome||'Ronda',modeloId:r.modeloId||null,ts:r.ts,inspNome:r.inspNome,c:0,nc:0,ina:0,docs:[]};g.set(k,e)}
    e.docs.push(r);e.c+=r.c||0;e.nc+=r.nc||0;e.ina+=(r.ina||0)+(r.na||0);if(r.ts<e.ts)e.ts=r.ts});

})();

<script>
/* ==========================================================================
   Núcleo · permissões por perfil (um único lugar para todas as regras de acesso)

     Administrador : todas as telas (inclusive Cadastros)
     Gestor        : Painel, Nova ronda, Histórico e Não conformidades
     Inspetor      : "Nova ronda" e "Histórico" (este mostra apenas as rondas feitas por ele)

   Rondas: uma ronda com responsável só é vista/realizada por ele (o Administrador
   vê e realiza todas); uma ronda com responsável "Todos" é vista e realizada por todos
   os usuários com acesso a Nova ronda. Perfil desconhecido é tratado como Inspetor (menor privilégio).

   Atenção: estas regras controlam a INTERFACE. O banco compartilhado é protegido
   apenas pelo código de acesso da equipe (veja LEIA-ME.md).
   ========================================================================== */
(()=>{
const RH=window.RH,st=RH.st;

const PAGES={
  admin:['painel','ronda','historico','ncs','cadastros'],
  gestor:['painel','ronda','historico','ncs'],
  inspetor:['ronda','historico']

const pagesOf=()=>PAGES[st.me&&st.me.role]||PAGES.inspetor;
const gerencia=()=>!!st.me&&['admin','gestor'].includes(st.me.role);

RH.access={
  PAGES,
  can:p=>!!st.me&&pagesOf().includes(p),
  firstPage:()=>pagesOf()[0],
  gerencia,
  /* o histórico deve ser restrito às rondas do próprio usuário? (todo perfil que não gerencia, inclusive desconhecido) */
  soPropriasRondas:()=>!!st.me&&!gerencia(),
  /* a execução/documento de ronda `r` pode ser vista pelo usuário logado? */
  rondaFeitaVisivel:r=>!!st.me&&(gerencia()||(r.inspId?r.inspId===st.me.id:r.inspNome===st.me.nome)),
  /* a ronda cadastrada `m` aparece para o usuário `u`? */
  rondaVisivel:(m,u)=>!!u&&m.ativo!==false&&(u.role==='admin'||!m.responsavelId||m.responsavelId===u.id),
  canEditNC:()=>gerencia()&&st.canWrite!==false,
  canDeleteNC:()=>gerencia()&&st.canWrite!==false,

<script>
/* ==========================================================================
   Núcleo · senhas
   - hash   : guarda apenas o hash PBKDF2-SHA256 (60 mil iterações) com sal por usuário.
              Requer HTTPS (ou localhost), pois usa crypto.subtle.
   - checkSenha : regra de senha do sistema (mínimo 8 caracteres e 1 símbolo especial).
   - senhaForte : gera uma senha aleatória que cumpre a regra.
   ========================================================================== */
(()=>{
const RH=window.RH;
const enc=s=>new TextEncoder().encode(s);
RH.hash=async(pw,salt)=>{
  const k=await crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc(salt),iterations:60000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};

RH.SENHA_REGRA='Mínimo de 8 caracteres, com pelo menos 1 símbolo especial (ex.: ! @ # $ % & *).';
/* devolve '' se a senha é válida; senão, a mensagem do problema. Símbolo = qualquer caractere que não seja letra ou número */
RH.checkSenha=pw=>{
  pw=String(pw??'');
  if(pw.length<8)return 'A senha precisa ter ao menos 8 caracteres.';
  if(!/[^\p{L}\p{N}\s]/u.test(pw))return 'A senha precisa ter ao menos 1 símbolo especial (ex.: ! @ # $ % & *).';
  return ''};

RH.senhaForte=(n=14)=>{
  const L='abcdefghijkmnpqrstuvwxyz',U='ABCDEFGHJKLMNPQRSTUVWXYZ',D='23456789',Y='!@#$%&*?',ALL=L+U+D+Y;
  const rnd=m=>crypto.getRandomValues(new Uint32Array(1))[0]%m;
  const out=[L[rnd(L.length)],U[rnd(U.length)],D[rnd(D.length)],Y[rnd(Y.length)]];
  while(out.length<n)out.push(ALL[rnd(ALL.length)]);
  for(let i=out.length-1;i>0;i--){const j=rnd(i+1);[out[i],out[j]]=[out[j],out[i]]}   // embaralha
  return out.join('')};
})();

<script>
/* ==========================================================================
   Núcleo · agenda das rondas (dias da semana + horários)
   Uma ronda cadastrada tem:  dias:[0..6] (0 = domingo)  e  horarios:['08:00','20:00'].
   Ela deve ser realizada em cada dia marcado, em cada horário.

   Regra de "em atraso" (usa sempre o horário do aparelho):
   - olha o último horário previsto que já passou (S);
   - a ronda conta como realizada se houve uma execução a partir de 1 h ANTES de S;
   - fica "em atraso" quando passou 1 h de S sem execução.
   - horários anteriores à criação/alteração da agenda (agendaDesde) não contam.
   Rondas antigas, sem agenda, continuam usando a periodicidade em horas (freq).
   ========================================================================== */
(()=>{
const RH=window.RH;
const HORA=36e5,ANTECIPA=HORA,TOLERA=HORA;
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_LONGOS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

const temAgenda=m=>Array.isArray(m.dias)&&m.dias.length>0&&Array.isArray(m.horarios)&&m.horarios.length>0;
const validaHora=h=>/^([01]\d|2[0-3]):[0-5]\d$/.test(h);

/* "Seg a Sex", "Seg, Qua, Sex", "Todos os dias" */
function resumoDias(dias){
  const d=[...new Set(dias)].sort((a,b)=>a-b);
  if(d.length===7)return 'Todos os dias';
  const g=[];d.forEach(x=>{const l=g[g.length-1];if(l&&l[l.length-1]===x-1)l.push(x);else g.push([x])});
  return g.map(l=>l.length>=3?`${DIAS[l[0]]} a ${DIAS[l[l.length-1]]}`:l.map(x=>DIAS[x]).join(', ')).join(', ')}

/* texto curto da agenda (ou da periodicidade antiga) */
const resumo=m=>temAgenda(m)?`${resumoDias(m.dias)} · ${[...m.horarios].sort().join(', ')}`:`A cada ${+m.freq||24} h`;

/* instantes previstos entre `de` e `ate` (ms), em ordem crescente */
function horarios(m,de,ate){
  const out=[];if(!temAgenda(m))return out;
  const d=new Date(de);d.setHours(0,0,0,0);
  for(;d.getTime()<=ate;d.setDate(d.getDate()+1)){
    if(!m.dias.includes(d.getDay()))continue;
    for(const h of m.horarios){const [hh,mm]=h.split(':').map(Number),t=new Date(d);t.setHours(hh,mm,0,0);
      if(t.getTime()>=de&&t.getTime()<=ate)out.push(t.getTime())}}
  return out.sort((a,b)=>a-b)}

const ultimo=(m,now)=>{const l=horarios(m,now-8*864e5,now);return l.length?l[l.length-1]:null};
const proximo=(m,now)=>{const l=horarios(m,now+1,now+8*864e5);return l.length?l[0]:null};

/* a ronda está em atraso agora? `lastTs` = data da última execução (ou null) */
function atrasada(m,lastTs,now=Date.now()){
  if(!temAgenda(m))return !lastTs||now-lastTs>(+m.freq||24)*HORA;
  const s=ultimo(m,now);if(s==null)return false;
  if(m.agendaDesde&&s<m.agendaDesde)return false;
  if(now<=s+TOLERA)return false;
  return !(lastTs!=null&&lastTs>=s-ANTECIPA)}

const fmtSlot=t=>{const d=new Date(t);return `${DIAS[d.getDay()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

RH.agenda={DIAS,DIAS_LONGOS,temAgenda,validaHora,resumo,resumoDias,horarios,ultimo,proximo,atrasada,fmtSlot};
})();

</script>
<script>
/* ==========================================================================
   Núcleo · sugestão automática de "Orientação / ação esperada"
   A partir do NOME do tipo de não conformidade, devolve uma orientação curta e
   objetiva (o que fazer, em ordem). É uma biblioteca de regras embutida no sistema:
   funciona offline e sem enviar dados a nenhum serviço. O texto gerado é só um
   ponto de partida — o campo continua editável.
   ========================================================================== */
(()=>{
const RH=window.RH;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* [palavras-chave (sem acento), orientação]. Vence a regra com mais palavras encontradas. */
const REGRAS=[
 [['maos','lavagem das','higiene das','antissepsia das','cinco momentos'],
  'Higienizar as mãos com água e sabonete ou álcool 70% nos 5 momentos da assistência, repor insumos faltantes e orientar a equipe no ato.'],
 [['higien','limpez','sujo','sujeira','poeira','desinfec','assepsia'],
  'Refazer a limpeza e a desinfecção do local com o produto padronizado, registrar no checklist e avisar a chefia do setor.'],
 [['esteriliz','autoclave','termodesinfec','indicador biologico','indicador quimico'],
  'Suspender o uso dos materiais do ciclo, refazer o processo de esterilização conforme o protocolo e registrar o resultado.'],
 [['calibra'],
  'Retirar o equipamento de uso, sinalizar como "calibração vencida", agendar a calibração com a engenharia clínica e registrar.'],
 [['manutenc','preventiva'],
  'Sinalizar o equipamento, agendar a manutenção com a engenharia clínica e registrar o chamado e o prazo.'],
 [['equipamento','aparelho','falha','defeito','quebrad','avaria','danific','nao liga','monitor','ventilador','bomba','desfibrilador'],
  'Retirar o equipamento de uso, sinalizar como "em manutenção", acionar a engenharia clínica e registrar o chamado.'],
 [['alarme'],
  'Testar o alarme, acionar a engenharia clínica se não funcionar e só devolver o equipamento ao uso depois de validado.'],
 [['medicament','insumo','validade','vencid','vencimento','lote'],
  'Separar e identificar o item vencido, descartar conforme o PGRSS, repor o estoque e avisar a farmácia.'],
 [['temperatura','refriger','geladeira','cadeia de frio','freezer','vacina'],
  'Conferir e ajustar a temperatura, registrar o valor, avaliar o descarte dos itens e acionar a manutenção se persistir.'],
 [[' epi ',' epis ','luva','mascara','avental','oculos','capote','protecao individual'],
  'Repor imediatamente os EPIs no ponto de uso e orientar a equipe sobre o uso correto.'],
 [['perfurocortante','descarte','residuo','lixo','lixeira','coleta','pgrss'],
  'Descartar no recipiente correto, trocar o recipiente se estiver cheio ou danificado e orientar a equipe sobre a segregação.'],
 [['rota de fuga','saida de emergencia','extintor','incendio','hidrante','sinaliza','obstru','corredor'],
  'Desobstruir e sinalizar imediatamente a rota, repor ou recarregar o extintor se necessário e avisar a segurança do trabalho.'],
 [['oxigenio','gas','vazamento','vacuo','ar comprimido'],
  'Fechar a válvula do ponto, isolar a área, acionar a engenharia/manutenção imediatamente e não usar o ponto até a liberação.'],
 [['eletric','tomada','fiacao','fio ','disjuntor','iluminacao','lampada','energia','gerador'],
  'Isolar o ponto elétrico, não utilizar e acionar a manutenção predial para reparo; registrar o chamado.'],
 [['infiltra','goteira','mofo','umidade','rachadura','pintura','piso','parede','forro','teto','estrutura'],
  'Isolar e sinalizar a área, abrir chamado para a manutenção predial e acompanhar o reparo até a conclusão.'],
 [['agua','torneira',' pia ','lavatorio','sabonete','papel toalha','alcool','higiene das maos','dispenser'],
  'Repor sabonete, papel toalha e álcool no ponto de uso e acionar a manutenção se houver defeito na pia ou na torneira.'],
 [['ar condicionado','climatiza','ventilacao','exaustor','pressao'],
  'Verificar o funcionamento e a temperatura do ambiente, acionar a manutenção e registrar; avaliar a continuidade das atividades.'],
 [['praga','inseto','barata','rato','roedor','mosquito'],
  'Isolar e higienizar a área, avisar a Higiene/CCIH para acionar o controle de pragas e registrar a ocorrência.'],
 [['identifica','etiqueta','rotulo','placa','pulseira'],
  'Identificar ou etiquetar corretamente o item no ato, conferir os dados e orientar a equipe.'],
 [['registro','document','assinatura','prontuario','preench','checklist','formulario','impresso'],
  'Completar o registro com o responsável, assinar e datar, e orientar a equipe sobre o preenchimento correto.'],
 [['acesso','porta','fechadura','chave','seguranca patrimonial','vigilancia'],
  'Corrigir o acesso (fechar, trancar ou consertar), registrar a ocorrência e avisar a segurança patrimonial.'],
 [['barulho','ruido'],
  'Identificar a origem do ruído, corrigir ou acionar a manutenção e orientar a equipe para reduzir o ruído.'],
 [['paciente','queda','contencao','isolamento','precaucao'],
  'Garantir a segurança do paciente primeiro, corrigir a situação, notificar a liderança e registrar a ocorrência.']
];

RH.sugerirOrientacao=nome=>{
  const n=' '+norm(nome).trim()+' ';
  if(n.trim()==='')return '';
  let best=null,bestScore=0;
  for(const [kws,txt] of REGRAS){
    const score=kws.reduce((a,k)=>a+(n.includes(k)?1:0),0);
    if(score>bestScore){best=txt;bestScore=score}}
  if(best)return best;
  const t=String(nome).trim();
  return `Corrigir a não conformidade "${t}" imediatamente, registrar a ação realizada e avisar o responsável pelo setor. Se não for possível resolver na hora, sinalizar o local e abrir chamado.`;
};
})();

</script>
<script>
/* ==========================================================================
   Núcleo · imagens
   Reduz fotos (câmera do celular) antes de gravar: miniatura 160 px e versão
   completa 960 px, ambas em JPEG. Devolve {thumb, full} (data URLs).

   Pensado para celulares com pouca memória: a foto original (12 MP ou mais) é
   decodificada UMA vez, sem passar por um data URL gigante (FileReader), e os
   bitmaps/canvas são liberados logo em seguida. A miniatura sai da versão já
   reduzida. Antes, a foto era lida e decodificada duas vezes em tamanho original,
   o que podia fazer o navegador do celular encerrar a página.
   ========================================================================== */
(()=>{
const RH=window.RH;

/* decodifica o arquivo uma única vez → {src, w, h, free()} */
async function decode(file){
  if(window.createImageBitmap){
    /* foto de câmera (grande): já decodifica reduzida (≈1200 px) em vez de 12 MP+ inteiros na memória */
    if(file.size>4e5){try{const b=await createImageBitmap(file,{resizeWidth:1200,resizeQuality:'medium',imageOrientation:'from-image'});return{src:b,w:b.width,h:b.height,free:()=>{try{b.close()}catch(e){}}}}catch(e){}}
    try{const b=await createImageBitmap(file,{imageOrientation:'from-image'});return{src:b,w:b.width,h:b.height,free:()=>{try{b.close()}catch(e){}}}}
    catch(e){/* formato/opção não suportada: tenta o caminho clássico abaixo */}}
  const url=URL.createObjectURL(file);
  try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    return{src:im,w:im.naturalWidth||im.width,h:im.naturalHeight||im.height,free:()=>{im.src='';URL.revokeObjectURL(url)}}}
  catch(e){URL.revokeObjectURL(url);throw e}}

function draw(src,w,h,max,q){
  const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
  const out=c.toDataURL('image/jpeg',q);c.width=c.height=0;return out}

RH.processImg=async file=>{
  const d=await decode(file);
  try{
    const full=draw(d.src,d.w,d.h,960,.7);
    /* miniatura a partir da versão reduzida (barato), não da foto original */
    const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=full});
    const thumb=draw(im,im.naturalWidth||im.width,im.naturalHeight||im.height,160,.6);
    return{thumb,full}}
  finally{d.free()}};
})();

</script>
<script>
/* ==========================================================================
   Núcleo · componentes de interface
   toast (aviso), tooltip, janela modal, confirmação em dois toques e os
   pequenos "selos" reutilizados em várias telas (severidade, situação, ativo,
   orientação da não conformidade).
   ========================================================================== */
(()=>{
const RH=window.RH,{$,esc,ic,SEV,ST}=RH,st=RH.st;

/* ---------- aviso rápido ---------- */
RH.toast=(m,k)=>{const t=$('#toast');t.innerHTML=`<div class="toast ${k||''}" role="status">${esc(m)}</div>`;clearTimeout(RH.toast.t);RH.toast.t=setTimeout(()=>t.innerHTML='',3800)};

/* ---------- tooltip (qualquer elemento com data-tip + gráfico) ---------- */
const tip=RH.tip=$('#tip');
RH.showTip=(t,x,y)=>{tip.textContent=t;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(innerWidth-w-8,Math.max(8,x+12))+'px';tip.style.top=Math.max(8,y-h-12)+'px'};
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)RH.showTip(t.dataset.tip,e.clientX,e.clientY);else if(!e.target.closest||!e.target.closest('#ch-line'))tip.hidden=true});

/* ---------- janela modal ---------- */
RH.modal=(html,wide)=>{$('#modal').innerHTML=`<div class="ov" data-act="ovClose"><div class="mod ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$('#modal input:not([type=file]),#modal select,#modal textarea');if(f&&matchMedia('(min-width:700px)').matches)f.focus()};
RH.closeModal=()=>{$('#modal').innerHTML='';st.M=null};
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').firstChild)RH.closeModal()});

/* ---------- confirmação em dois toques: devolve true no 2º toque (até 3 s depois) ---------- */
let armT;
RH.confirmArm=(fn,msg)=>{if(fn.armed){fn.armed=false;return true}fn.armed=true;RH.toast(msg);clearTimeout(armT);armT=setTimeout(()=>fn.armed=false,3000);return false};

/* ---------- selos ---------- */
RH.sevPill=n=>`<span class="sev s${n}"><b>${n}</b>${SEV[n]||''}</span>`;
RH.stPill=s=>`<span class="pill st-${s}"><i></i>${ST[s]||s}</span>`;
RH.actPill=x=>x.ativo===false?'<span class="pill off">Inativo</span>':'<span class="pill okp">Ativo</span>';
/* alerta com a "Orientação / ação esperada" de um tipo de NC (vazio se não houver texto) */
RH.orientBox=txt=>txt?`<div class="orient" role="note">${ic('alert',18)}<div><b>Orientação / ação esperada</b>${esc(txt)}</div></div>`:'';
})();

</script>
<script>
/* ==========================================================================
   Núcleo · acesso aos dados
   - put / upd / del : gravam, atualizam e apagam documentos ("coleção/id").
   - safe(fn)        : executa uma gravação e mostra uma mensagem clara se falhar.
   - syncAll()       : assina todas as coleções; a cada mudança atualiza RH.S e a tela.
   ========================================================================== */
(()=>{
const RH=window.RH,{S,st,COLS,byId}=RH;

RH.put=(c,id,d)=>st.db.doc(`${c}/${id}`).set(d);
RH.upd=(c,id,d)=>st.db.doc(`${c}/${id}`).update(d);
RH.del=(c,id)=>st.db.doc(`${c}/${id}`).delete();

RH.safe=async fn=>{
  try{return await fn()}
  catch(e){console.error(e);const c=e&&e.code;
    RH.toast(c==='not_found'?'Este registro não existe mais (foi excluído em outro aparelho). Atualize a tela.':c==='quota_exceeded'?'Limite de armazenamento atingido.':'Não foi possível salvar. Verifique a conexão e tente novamente.','bad');
    return undefined}};

const ready={};
function sync(col){
  let q=st.db.collection(col);if(col==='rondas'||col==='ncs')q=q.orderBy('ts','desc').limit(1000);
  q.onSnapshot(s=>{const rows=s.docs.map(d=>({id:d.id,...d.data()}));
    if(col==='config')S.cfg=rows.find(r=>r.id==='main')||{};else S[col]=rows;
    ready[col]=true;onData()},e=>{console.error(col,e);ready[col]=true;onData()});
}
function onData(){
  if(!st.booted){
    if(COLS.every(c=>ready[c])){st.booted=true;
      try{let id=sessionStorage.getItem('rh_uid'),pg=sessionStorage.getItem('rh_page');
        /* o celular pode descarregar a página enquanto a câmera está aberta e perder a sessão da aba:
           um marcador curto (15 min), gravado ao tocar em "Anexar foto", devolve o usuário à ronda em andamento */
        if(!id){const r=JSON.parse(localStorage.getItem('rh_resume')||'null');if(r&&r.uid&&Date.now()-r.ts<9e5){id=r.uid;pg=r.page;sessionStorage.setItem('rh_uid',id)}}
        localStorage.removeItem('rh_resume');
        const u=id&&byId(S.users,id);if(u&&u.ativo!==false){st.me=u;const ct=sessionStorage.getItem('rh_cadtab');if(pg)st.page=pg;if(ct)st.cadTab=ct}}catch(e){}
      RH.renderRoot()}
    return}
  if(st.me){const u=byId(S.users,st.me.id);if(!u||u.ativo===false){RH.logout();return}st.me=u}
  clearTimeout(onData.t);onData.t=setTimeout(()=>RH.renderRoot(true),200);
}
RH.syncAll=()=>COLS.forEach(sync);
})();

</script>
<script>
/* ==========================================================================
   Núcleo · validação de presença no local (código de barras + antena Wi-Fi / BSSID)

   Cada sala ou equipamento pode ter:
     - codigoLocal : valor do código de barras/QR impresso e fixado no local;
     - bssids      : antenas Wi-Fi (BSSID) que cobrem o local, uma por linha. Aceita curinga
                     no final (aa:bb:cc:dd:*:*) para antenas com vários rádios/SSIDs.
   Equipamento sem BSSID próprio herda os BSSIDs das salas do mesmo setor.

   Política (Cadastros → Hospital, gravada em config/main):
     valLocal : 'off' (padrão, comportamento antigo) | 'registrar' (grava a evidência, não bloqueia)
                | 'exigir' (o checklist do local só é liberado após ler o código; não finaliza sem isso)
     valBssid : 'se_disponivel' (padrão) | 'exigir' (sem BSSID legível = leitura rejeitada)

   O BSSID NÃO pode ser lido por JavaScript em navegador comum. Ele só vem de uma camada nativa
   (Capacitor + @capgo/capacitor-wifi, ou uma ponte própria window.RondaNativo.getBssid()).
   Veja VALIDACAO-LOCAL.md.

   API: window.RH.local  (a parte de regras — validar, parseBssids… — não depende da tela e é testada em tests/local.test.js)
   ========================================================================== */
(()=>{
const RH=window.RH,{S,st,byId}=RH;

/* ---------- normalização ---------- */
const normCodigo=s=>String(s??'').normalize('NFKC').replace(/\s+/g,'').toUpperCase();

/* 6 octetos (hex ou *), aceitando aa:bb:.., aa-bb-.., aabb.ccdd.eeff e aabbccddeeff */
function octetos(s){
  s=String(s??'').trim().toLowerCase();
  if(/^[0-9a-f]{12}$/.test(s))return s.match(/../g);
  if(/^[0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4}$/.test(s))return s.replace(/\./g,'').match(/../g);
  const p=s.split(/[:-]/);
  return p.length===6&&p.every(x=>/^([0-9a-f]{2}|\*)$/.test(x))?p:null}
/* valores que o Android devolve quando NÃO tem permissão/localização ligada não são antenas reais */
const BSSID_FALSOS=new Set(['00:00:00:00:00:00','02:00:00:00:00:00','ff:ff:ff:ff:ff:ff']);
function normBssid(s){const o=octetos(s);if(!o||o.includes('*'))return '';const j=o.join(':');return BSSID_FALSOS.has(j)?'':j}

/* texto do cadastro → {lista:[padrões normalizados], invalidos:[trechos com erro]} */
function parseBssids(txt){
  const lista=[],invalidos=[];
  String(txt??'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).forEach(t=>{
    const o=octetos(t),w=o?o.indexOf('*'):-1;
    /* curinga só no final e com pelo menos 3 octetos fixos (senão qualquer antena passaria) */
    if(!o||(w!==-1&&(w<3||o.slice(w).some(x=>x!=='*')))||o.join(':')==='00:00:00:00:00:00'||o.join(':')==='02:00:00:00:00:00'){invalidos.push(t);return}
    const j=o.join(':');if(!lista.includes(j))lista.push(j)});
  return {lista,invalidos}}
function bssidConfere(b,lista){
  const o=octetos(b);if(!o||o.includes('*'))return false;
  return lista.some(p=>{const q=octetos(p);return !!q&&q.every((x,i)=>x==='*'||x===o[i])})}

/* ---------- política e alvos ---------- */
const politica=()=>({
  modo:['registrar','exigir'].includes(S.cfg.valLocal)?S.cfg.valLocal:'off',
  bssid:S.cfg.valBssid==='exigir'?'exigir':'se_disponivel'});

const alvos=()=>[
  ...S.salas.map(s=>({tipo:'s',id:s.id,nome:s.nome,codigoLocal:s.codigoLocal})),
  ...S.equipamentos.map(e=>({tipo:'e',id:e.id,nome:e.nome,codigoLocal:e.codigoLocal}))];

/* cada bloco da ronda tem exatamente um alvo: a sala ou o equipamento */
function alvoDoBloco(bl){
  const sala=bl.tipo==='sala',x=sala?byId(S.salas,bl.salaId):byId(S.equipamentos,(bl.eqIds||[])[0]);
  if(!x)return null;
  let bssids=x.bssids||'';
  const setor=sala?x.setor:RH.setorEq(x);
  if(!sala&&!parseBssids(bssids).lista.length&&setor)bssids=S.salas.filter(s=>s.setor===setor).map(s=>s.bssids||'').join('\n');
  return {tipo:sala?'s':'e',id:x.id,nome:x.nome,setor,codigoLocal:x.codigoLocal||'',bssids}}

/* ---------- regra de validação (função pura) ----------
   entrada : alvo {nome,codigoLocal,bssids}, lido (texto do código), bssid {ok,valor,msg}, pol {bssid}
   saída   : {ok, codigo, rede, msg}
     codigo: ok | sem_cadastro | vazio | codigo_incorreto | codigo_outro_local | rede_fora | rede_indisponivel
     rede  : confere | fora | indisponivel | sem_cadastro | nao_exigida | nao_verificada            */
function validar({alvo,lido,bssid,pol}){
  const R=(ok,codigo,msg,rede)=>({ok,codigo,msg,rede});
  const L=normCodigo(lido),esperado=normCodigo(alvo.codigoLocal);
  if(!L)return R(false,'vazio','Nenhum código foi lido.','nao_verificada');
  if(!esperado)return R(true,'sem_cadastro','Este local não tem código cadastrado: presença não verificada.','nao_exigida');
  if(L!==esperado){
    const dono=alvos().find(a=>normCodigo(a.codigoLocal)===L);
    return dono?R(false,'codigo_outro_local',`Este código pertence a "${dono.nome}", não a "${alvo.nome}".`,'nao_verificada')
               :R(false,'codigo_incorreto',`O código lido não corresponde a "${alvo.nome}".`,'nao_verificada')}
  const lista=parseBssids(alvo.bssids).lista;
  if(!lista.length)return R(true,'ok','Código confere.','sem_cadastro');
  if(bssid&&bssid.ok)return bssidConfere(bssid.valor,lista)
    ?R(true,'ok','Código e antena Wi-Fi conferem.','confere')
    :R(false,'rede_fora',`Você está conectado a uma antena Wi-Fi que não pertence a "${alvo.nome}".`,'fora');
  if(pol&&pol.bssid==='exigir')return R(false,'rede_indisponivel',(bssid&&bssid.msg)||'Não foi possível identificar a antena Wi-Fi deste aparelho.','indisponivel');
  return R(true,'ok','Código confere (antena Wi-Fi não verificada neste aparelho).','indisponivel')}

/* ---------- leitura do BSSID (camada nativa) ---------- */
const MSG_BSSID={
  navegador:'Este navegador não permite ler a antena Wi-Fi. Use o aplicativo da Ronda (Android).',
  permissao:'Permita o acesso à localização e deixe a localização do aparelho ligada para identificar a antena Wi-Fi.',
  semwifi:'O aparelho não está conectado a uma rede Wi-Fi.',
  erro:'Não foi possível ler a antena Wi-Fi.'};
const comTempo=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);

async function bssidBruto(){
  if(typeof RH.local.provedorBssid==='function'){const r=await RH.local.provedorBssid();return typeof r==='string'?{valor:r}:(r||{})}
  const cap=window.Capacitor,W=cap&&cap.Plugins&&cap.Plugins.CapacitorWifi;
  if(W&&(!cap.isNativePlatform||cap.isNativePlatform())){
    let p=await W.checkPermissions();
    if(!p||p.location!=='granted')p=await W.requestPermissions();
    if(!p||p.location!=='granted')return {motivo:'permissao'};
    const i=await W.getWifiInfo();return {valor:i&&i.bssid}}
  if(window.RondaNativo&&typeof window.RondaNativo.getBssid==='function')return {valor:await window.RondaNativo.getBssid()};
  return {motivo:'navegador'}}

/* → {ok, valor, motivo, msg}; nunca lança erro */
async function lerBssid(){
  try{
    const r=await comTempo(Promise.resolve(bssidBruto()),4000),v=normBssid(r.valor);
    if(v)return {ok:true,valor:v};
    const motivo=r.motivo||(r.valor?'permissao':'semwifi');   /* 02:00:… = sem permissão ou localização desligada */
    return {ok:false,valor:'',motivo,msg:MSG_BSSID[motivo]||MSG_BSSID.erro}
  }catch(e){return {ok:false,valor:'',motivo:'erro',msg:MSG_BSSID.erro}}}

/* ---------- leitura do código de barras (câmera) ---------- */
const FORMATOS=['code_128','code_39','code_93','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code','data_matrix'];
let zxP=null;
function carregaZXing(){
  if(window.ZXing)return Promise.resolve(window.ZXing);
  /* 1º arquivo local (se você copiou para js/vendor/), 2º CDN fixada em versão */
  const fontes=['js/vendor/zxing-library.min.js','https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'];
  return zxP||(zxP=(async()=>{
    for(const src of fontes){
      try{await new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
        if(window.ZXing)return window.ZXing}catch(e){}}
    zxP=null;throw new Error('zxing')})())}

/* devolve uma função async () => texto|null que lê o quadro atual do <video> */
async function criaDecodificador(video){
  if('BarcodeDetector' in window){
    try{
      const sup=await window.BarcodeDetector.getSupportedFormats(),f=FORMATOS.filter(x=>sup.includes(x));
      if(f.length){const d=new window.BarcodeDetector({formats:f});return async()=>{const r=await d.detect(video);return r[0]&&r[0].rawValue||null}}
    }catch(e){}}
  const Z=await carregaZXing(),B=Z.BarcodeFormat,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[B.CODE_128,B.CODE_39,B.CODE_93,B.CODABAR,B.EAN_13,B.EAN_8,B.ITF,B.UPC_A,B.UPC_E,B.QR_CODE,B.DATA_MATRIX]);
  h.set(Z.DecodeHintType.TRY_HARDER,true);
  const reader=new Z.MultiFormatReader();reader.setHints(h);
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  return async()=>{
    if(!video.videoWidth)return null;
    c.width=video.videoWidth;c.height=video.videoHeight;x.drawImage(video,0,0);
    try{return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText()}catch(e){return null}}}

/* abre a câmera num painel próprio; devolve o texto lido ou null (cancelado/sem câmera) */
async function escanear(titulo){
  if(typeof RH.local.leitor==='function')return RH.local.leitor(titulo);   /* gancho para testes ou leitor externo */
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){RH.toast('Este navegador não permite abrir a câmera aqui.','bad');return null}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){RH.toast(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'Permissão da câmera negada. Libere a câmera para este site/aplicativo.':'Não foi possível abrir a câmera.','bad');return null}
  return new Promise(resolve=>{
    const o=document.createElement('div');o.id='scan-ov';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Leitor de código de barras');
    o.style.cssText='position:fixed;inset:0;z-index:210;background:#000;display:flex;flex-direction:column;color:#fff';
    o.innerHTML=`<div style="padding:12px 16px;font-weight:600">${RH.esc(titulo||'Leia o código de barras do local')}</div>
      <div style="position:relative;flex:1;min-height:0"><video id="scan-v" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;background:#000"></video>
      <div style="position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px solid #4cc27f;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)"></div></div>
      <div id="scan-msg" style="padding:10px 16px;text-align:center;font-size:13px">Aponte a câmera para a etiqueta fixada no local.</div>
      <div style="display:flex;justify-content:center;padding:0 14px 16px"><button type="button" class="btn" id="scan-x">Cancelar</button></div>`;
    document.body.appendChild(o);
    let fim=false,timer=null;
    const parar=v=>{if(fim)return;fim=true;clearInterval(timer);stream.getTracks().forEach(t=>t.stop());o.remove();resolve(v)};
    o.querySelector('#scan-x').onclick=()=>parar(null);
    addEventListener('pagehide',()=>parar(null),{once:true});
    const v=o.querySelector('#scan-v');v.srcObject=stream;v.play().catch(()=>{});
    criaDecodificador(v).then(dec=>{
      let ocupado=false;
      timer=setInterval(async()=>{
        if(ocupado||fim)return;ocupado=true;
        try{const t=await dec();if(t&&!fim)parar(t)}catch(e){}
        ocupado=false},180)
    }).catch(()=>{const m=o.querySelector('#scan-msg');if(m)m.textContent='Não foi possível iniciar o leitor de código de barras neste aparelho.'})})}

/* ---------- check-in de um bloco da ronda ---------- */
/* lê o código e, logo em seguida, a antena Wi-Fi; devolve o registro (ok ou rejeitado) ou null se cancelado */
async function checkin(bl){
  const alvo=alvoDoBloco(bl);if(!alvo)return null;
  const lido=await escanear('Leia o código de barras: '+alvo.nome);
  if(lido==null)return null;
  const bssid=await lerBssid(),r=validar({alvo,lido,bssid,pol:politica()});
  return {ts:Date.now(),ok:r.ok,codigo:r.codigo,rede:r.rede,msg:r.msg,lido:String(lido).slice(0,80),bssid:bssid.valor||''}}

/* guarda o resultado na ronda em andamento: R.chk[idDoBloco] = {ok: registro válido | null, falhas: últimas 5 rejeições} */
function registrar(R,sid,reg){
  const c=(R.chk=R.chk||{})[sid]=(R.chk[sid]||{ok:null,falhas:[]});
  if(reg.ok)c.ok=reg;else c.falhas=[...c.falhas,reg].slice(-5);
  return c}

/* o registro guardado ainda vale? (reavalia com as regras e o cadastro atuais: pega rascunho adulterado ou cadastro alterado) */
function revalida(alvo,reg){
  return validar({alvo,lido:reg.lido,bssid:{ok:!!reg.bssid,valor:reg.bssid},pol:politica()}).ok}

/* estado de um bloco com código próprio */
function estadoProprio(R,bl){
  const pol=politica(),alvo=pol.modo!=='off'&&alvoDoBloco(bl);
  if(!alvo)return {ativo:false,bloqueado:false};
  if(!normCodigo(alvo.codigoLocal))return {ativo:true,semCodigo:true,alvo,falhas:[],ok:null,bloqueado:false};
  const c=R.chk&&R.chk[bl.id],ok=c&&c.ok&&revalida(alvo,c.ok)?c.ok:null;
  return {ativo:true,alvo,ok,falhas:c?c.falhas:[],bloqueado:pol.modo==='exigir'&&!ok}}
/* Liberação em grupo: R.lib[idDoBloco] = idDoBlocoChave. O bloco dependente é liberado quando a chave tem presença
   confirmada (código + antena DA CHAVE); o código do próprio bloco não é exigido. Chave sem código ou ausente da ronda → o bloco volta a exigir o próprio. */
function estado(R,bl){
  const kid=R.lib&&R.lib[bl.id],kb=kid&&kid!==bl.id&&!(R.lib[kid])&&R.blocos.find(b=>b.id===kid);
  if(kb){
    const k=estadoProprio(R,kb);
    if(k.ativo&&!k.semCodigo)return {...k,dependente:true,viaId:kb.id}}
  return estadoProprio(R,bl)}
const pendencias=R=>R.blocos.filter(bl=>estado(R,bl).bloqueado);
/* blocos liberados pela leitura da chave `id` */
const dependentes=(R,id)=>R.blocos.filter(b=>b.id!==id&&R.lib&&R.lib[b.id]===id&&estado(R,b).dependente);

/* evidência gravada em cada documento de `rondas` (null quando a validação está desligada) */
function evidencia(R,bl){
  const e=estado(R,bl),modo=politica().modo;
  if(!e.ativo)return null;
  if(e.semCodigo)return {modo,status:'sem_codigo'};
  const f=(e.falhas||[]).map(x=>({ts:x.ts,codigo:x.codigo,lido:x.lido,bssid:x.bssid}));
  if(e.ok)return {modo,status:'confirmada',ts:e.ok.ts,rede:e.ok.rede,lido:e.ok.lido,bssid:e.ok.bssid,...(e.dependente?{via:e.alvo.nome}:{}),...(f.length?{falhas:f}:{})};
  return {modo,status:'nao_confirmada',...(f.length?{falhas:f}:{})}}

/* selo para o histórico */
function badge(p){
  if(!p)return '';
  const t=(c,x)=>`<span class="pill ${c}" title="Presença no local">${x}</span>`;
  if(p.status==='confirmada'){
    const n=(p.falhas||[]).length?` · ${p.falhas.length} leitura${p.falhas.length>1?'s':''} rejeitada${p.falhas.length>1?'s':''}`:'';
    return p.rede==='confere'?t('okp','Presença: código + Wi-Fi'+n):t(p.rede==='indisponivel'?'late':'okp','Presença: código'+(p.rede==='indisponivel'?' (Wi-Fi não verificado)':'')+n)}
  if(p.status==='sem_codigo')return t('off','Local sem código');
  return t('late','Presença não confirmada')}

/* ---------- cadastro ---------- */
/* valida e normaliza codigoLocal/bssids de uma sala ou equipamento; devolve '' ou a mensagem de erro */
function validaCadastro(data,ent,id){
  const c=normCodigo(data.codigoLocal),tipo=ent==='salas'?'s':'e';
  if(c){
    if(c.length<4)return 'O código do local precisa ter ao menos 4 caracteres.';
    const dup=alvos().find(a=>normCodigo(a.codigoLocal)===c&&!(a.id===id&&a.tipo===tipo));
    if(dup)return `O código ${c} já está em uso por "${dup.nome}". Cada local precisa de um código único.`}
  data.codigoLocal=c;
  const p=parseBssids(data.bssids);
  if(p.invalidos.length)return 'BSSID inválido: '+p.invalidos.join(', ')+'. Use aa:bb:cc:dd:ee:ff (ou aa:bb:cc:*:*:* para várias antenas do mesmo fabricante).';
  data.bssids=p.lista.join('\n');
  return ''}
function gerarCodigo(prefixo,extra){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',usados=new Set([...alvos().map(a=>normCodigo(a.codigoLocal)),...(extra||[])]);
  let c;do{const b=crypto.getRandomValues(new Uint8Array(6));c=`RH-${prefixo}-`+[...b].map(x=>A[x%A.length]).join('')}while(usados.has(c));
  return c}

RH.local={normCodigo,normBssid,parseBssids,bssidConfere,politica,alvoDoBloco,validar,lerBssid,escanear,checkin,registrar,estado,pendencias,dependentes,evidencia,badge,validaCadastro,gerarCodigo,
  /* ganchos opcionais: RH.local.leitor = async titulo => texto ; RH.local.provedorBssid = async () => 'aa:bb:..' | {valor,motivo} */
  leitor:null,provedorBssid:null};
if(typeof module!=='undefined'&&module.exports)module.exports=RH.local;
})();

</script>
<script>
/* ==========================================================================
   Núcleo · gerador de QR Code e Code 128 (sem bibliotecas, devolve SVG)
   - RH.barcode.qrSvg(texto)       QR Code, correção de erro nível Q (~25%), versões 1–6 (até 74 bytes)
   - RH.barcode.code128Svg(texto)  Code 128 (conjunto B: ASCII 32–126)
   Usado em Cadastros → Salas/Equipamentos → "Imprimir etiquetas".
   ========================================================================== */
(()=>{
const RH=(window.RH=window.RH||{});

/* ---------------- QR Code ---------------- */
const EXP=new Uint8Array(512),LOG=new Uint8Array(256);

const gmul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
function rsRem(data,n){
  let g=[1];
  for(let i=0;i<n;i++){const h=new Array(g.length+1).fill(0);g.forEach((c,j)=>{h[j]^=c;h[j+1]^=gmul(c,EXP[i])});g=h}
  const r=new Array(n).fill(0);
  for(const d of data){const f=d^r[0];r.shift();r.push(0);if(f)for(let i=0;i<n;i++)r[i]^=gmul(g[i+1],f)}
  return r}

/* nível Q: palavras de correção por bloco e grupos [nº de blocos, palavras de dados por bloco] */
const VER={1:{ec:13,g:[[1,13]]},2:{ec:22,g:[[1,22]]},3:{ec:18,g:[[2,17]]},4:{ec:26,g:[[2,24]]},5:{ec:18,g:[[2,15],[2,16]]},6:{ec:24,g:[[4,19]]}};
const ALIGN={2:18,3:22,4:26,5:30,6:34};
const dataCap=v=>VER[v].g.reduce((s,[n,d])=>s+n*d,0);
const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
  (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];

function qrMatrix(text){
  const bytes=[...new TextEncoder().encode(String(text))];

  const bits=[],put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
  put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));
  const cap=dataCap(v)*8;put(0,Math.min(4,cap-bits.length));

  for(let p=0;bits.length<cap;p^=1)put(p?0x11:0xEC,8);

  for(let i=0;i<maxD;i++)blocks.forEach(b=>{if(i<b.data.length)out.push(b.data[i])});
  for(let i=0;i<ec;i++)blocks.forEach(b=>out.push(b.ec[i]));
  const all=[];out.forEach(b=>{for(let i=7;i>=0;i--)all.push((b>>>i)&1)});

  const N=17+4*v,M=Array.from({length:N},()=>new Array(N).fill(false)),F=Array.from({length:N},()=>new Array(N).fill(false));
  const set=(x,y,d)=>{if(x>=0&&y>=0&&x<N&&y<N){M[y][x]=d;F[y][x]=true}};
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const m=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,m!==2&&m!==4)}};
  for(let i=0;i<N;i++){set(6,i,i%2===0);set(i,6,i%2===0)}   /* temporização primeiro: os quadrados de localização a sobrescrevem */
  finder(3,3);finder(N-4,3);finder(3,N-4);
  if(ALIGN[v]){const c=ALIGN[v];for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(c+dx,c+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
  const fmt=mask=>{
    const d=(3<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
    const b=((d<<10)|r)^0x5412,bit=i=>((b>>>i)&1)===1;
    for(let i=0;i<=5;i++)set(8,i,bit(i));set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));
    for(let i=9;i<15;i++)set(14-i,8,bit(i));
    for(let i=0;i<8;i++)set(N-1-i,8,bit(i));for(let i=8;i<15;i++)set(8,N-15+i,bit(i));
    set(8,N-8,true)};
  fmt(0);                                   /* só para reservar as áreas de formato */
  /* 4) dados em zigue-zague */
  let k=0;
  for(let right=N-1;right>=1;right-=2){
    if(right===6)right=5;
    for(let vert=0;vert<N;vert++)for(let j=0;j<2;j++){
      const x=right-j,y=((right+1)&2)===0?N-1-vert:vert;
      if(!F[y][x]&&k<all.length)M[y][x]=all[k++]===1}}

  const apply=mask=>M.map((row,y)=>row.map((d,x)=>F[y][x]?d:d!==MASKS[mask](x,y)));
  const penalty=m=>{
    let p=0;
    for(let t=0;t<2;t++)for(let a=0;a<N;a++){
      let run=1;
      for(let b=1;b<N;b++){const c=t?m[b][a]:m[a][b],q=t?m[b-1][a]:m[a][b-1];if(c===q){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}
    for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++)if(m[y][x]===m[y][x+1]&&m[y][x]===m[y+1][x]&&m[y][x]===m[y+1][x+1])p+=3;
    const pat=[1,0,1,1,1,0,1],white=[0,0,0,0];
    for(let y=0;y<N;y++)for(let i=0;i+11<=N;i++){const s=[];for(let j=0;j<11;j++)s.push(m[y][i+j]?1:0);
      if(s.every((x,j)=>x===pat.concat(white)[j])||s.every((x,j)=>x===white.concat(pat)[j]))p+=40}
    for(let x=0;x<N;x++)for(let i=0;i+11<=N;i++){const s=[];for(let j=0;j<11;j++)s.push(m[i+j][x]?1:0);
      if(s.every((x2,j)=>x2===pat.concat(white)[j])||s.every((x2,j)=>x2===white.concat(pat)[j]))p+=40}
    const dark=m.reduce((s,r)=>s+r.filter(Boolean).length,0),tot=N*N;
    p+=Math.max(0,Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;
    return p};
  let best=0,bestP=Infinity,bestM=null;
  for(let mask=0;mask<8;mask++){const m=apply(mask),p=penalty(m);if(p<bestP){bestP=p;best=mask;bestM=m}}
  /* grava o formato final sobre a matriz mascarada */
  const mm=bestM;
  {const d=(3<<3)|best;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
    const b=((d<<10)|r)^0x5412,bit=i=>((b>>>i)&1)===1,w=(x,y,val)=>{mm[y][x]=val};
    for(let i=0;i<=5;i++)w(8,i,bit(i));w(8,7,bit(6));w(8,8,bit(7));w(7,8,bit(8));
    for(let i=9;i<15;i++)w(14-i,8,bit(i));
    for(let i=0;i<8;i++)w(N-1-i,8,bit(i));for(let i=8;i<15;i++)w(8,N-15+i,bit(i));
    w(8,N-8,true)}
  return mm}

function qrSvg(text,{quiet=4,color='#000'}={}){
  const m=qrMatrix(text),N=m.length,T=N+quiet*2;let d='';
  m.forEach((row,y)=>{for(let x=0;x<N;){if(!row[x]){x++;continue}let e=x;while(e<N&&row[e])e++;d+=`M${x+quiet} ${y+quiet}h${e-x}v1h${x-e}z`;x=e}});
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${T} ${T}" shape-rendering="crispEdges" role="img" aria-label="QR Code"><rect width="${T}" height="${T}" fill="#fff"/><path d="${d}" fill="${color}"/></svg>`}

/* ---------------- Code 128 (conjunto B) ---------------- */
const C128=('212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112').split(' ');
function code128Widths(text){
  const s=String(text),vals=[];
  for(const ch of s){const c=ch.charCodeAt(0);if(c<32||c>126)throw new Error('O Code 128 desta etiqueta aceita só caracteres ASCII simples (sem acentos).');vals.push(c-32)}
  let sum=104;vals.forEach((v,i)=>{sum+=v*(i+1)});
  return [104,...vals,sum%103,106].map(v=>C128[v]).join('')}

function code128Svg(text,{quiet=10,height=60,color='#000'}={}){
  const w=code128Widths(text);let x=quiet,bar=true,d='';
  for(const ch of w){const n=+ch;if(bar)d+=`M${x} 0h${n}v${height}h${-n}z`;x+=n;bar=!bar}
  const T=x+quiet;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${T} ${height}" preserveAspectRatio="none" shape-rendering="crispEdges" role="img" aria-label="Código de barras"><rect width="${T}" height="${height}" fill="#fff"/><path d="${d}" fill="${color}"/></svg>`}

RH.barcode={qrMatrix,qrSvg,code128Svg,code128Widths};
if(typeof module!=='undefined'&&module.exports)module.exports=RH.barcode;
})();
