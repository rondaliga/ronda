name: Gerar aplicativos
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Criar o projeto Android
        run: npm run android:add
      - name: Compilar (sem assinatura própria)
        if: env.TEM_CHAVE != 'true'
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Compilar (release assinado)
        if: env.TEM_CHAVE == 'true'
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Assinar com a sua chave
        if: env.TEM_CHAVE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ronda.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ronda.jks" --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out android/app/build/outputs/apk/release/ronda-hospitalar.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Nomear o arquivo
        run: |
          mkdir -p saida
          if [ -f android/app/build/outputs/apk/release/ronda-hospitalar.apk ]; then cp android/app/build/outputs/apk/release/ronda-hospitalar.apk saida/ronda-hospitalar.apk
          else cp android/app/build/outputs/apk/debug/app-debug.apk saida/ronda-hospitalar.apk; fi
      - uses: actions/upload-artifact@v4
        with: { name: ronda-android-apk, path: saida/ronda-hospitalar.apk }
      - name: Publicar na página de versões
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: saida/ronda-hospitalar.apk }

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar o app
        run: npm run desktop:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: ronda-macos
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
      - name: Publicar na página de versões
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
