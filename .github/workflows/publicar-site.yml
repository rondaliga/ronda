name: Publicar site (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Conferir a versão
        run: node tools/atualizar-versao.js --verificar
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Montar o site (pasta www)
        run: node tools/preparar-www.js
      - name: Carimbar a versão no service worker
        run: sed -i "s/^const V='[^']*'/const V='ronda-${GITHUB_SHA::7}'/" www/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4
